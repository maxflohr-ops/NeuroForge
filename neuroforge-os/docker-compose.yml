services:

  # ─────────────────────────────────────────
  # Main pipeline — run one topic at a time
  # Usage:
  #   docker compose run --rm pipeline \
  #     --topic "Stop Overthinking" \
  #     --faculty "Dr. Nova Vale" \
  #     --mode full --no-qa
  # ─────────────────────────────────────────
  pipeline:
    build: .
    env_file: .env
    volumes:
      - ./output:/app/output
      - ./neuroforge_db.json:/app/neuroforge_db.json

  # ─────────────────────────────────────────
  # HeyGen setup — find avatar/voice IDs
  # Usage:
  #   docker compose run --rm heygen-setup \
  #     --faculty "Dr. Nova Vale" --save
  # ─────────────────────────────────────────
  heygen-setup:
    build: .
    entrypoint: ["python", "scripts/heygen_setup.py"]
    env_file: .env
    volumes:
      - ./output:/app/output
      - ./.heygen.env:/app/.heygen.env

  # ─────────────────────────────────────────
  # HeyGen producer — generate videos
  # Usage:
  #   docker compose run --rm heygen-producer \
  #     --topic "Stop Overthinking" \
  #     --faculty "Dr. Nova Vale" \
  #     --scripts "1-5" --dry-run
  # ─────────────────────────────────────────
  heygen-producer:
    build: .
    entrypoint: ["python", "scripts/heygen_producer.py"]
    env_file: .env
    volumes:
      - ./output:/app/output

  # ─────────────────────────────────────────
  # Script parser — splits batch MD into JSONs
  # Usage:
  #   docker compose run --rm parse-scripts \
  #     --file output/stop_overthinking/04_shorts_scripts_*.md \
  #     --topic "Stop Overthinking"
  # ─────────────────────────────────────────
  parse-scripts:
    build: .
    entrypoint: ["python", "scripts/parse_scripts.py"]
    env_file: .env
    volumes:
      - ./output:/app/output

  # ─────────────────────────────────────────
  # Airtable sync — syncs content to Airtable
  # Usage:
  #   docker compose run --rm airtable-sync --dry-run   # preview
  #   docker compose run --rm airtable-sync             # live sync
  #   docker compose run --rm airtable-sync --topic "Stop Overthinking"
  # ─────────────────────────────────────────
  airtable-sync:
    build: .
    entrypoint: ["python", "scripts/airtable_sync.py"]
    env_file: .env
    volumes:
      - ./output:/app/output
      - ./neuroforge_db.json:/app/neuroforge_db.json

  # ─────────────────────────────────────────
  # OpenClaw Airtable Logger — continuously improves via Airtable
  # Logs interactions, performance, and suggests improvements
  # Usage:
  #   python3 scripts/openclaw_airtable_logger.py
  #   Import in OpenClaw agent for live logging
  # ─────────────────────────────────────────
  openclaw-logger:
    build: .
    entrypoint: ["python", "scripts/openclaw_airtable_logger.py"]
    env_file: .env
    profiles:
      - openclaw

  # ─────────────────────────────────────────
  # Pinterest Pipeline — BANDERSNATCH
  # ─────────────────────────────────────────

  # Step 1: Research trending content themes
  # Usage:
  #   docker compose run --rm pinterest-trends
  #   docker compose run --rm pinterest-trends --niches southern-gothic,americana --dry-run
  pinterest-trends:
    build: .
    entrypoint: ["python", "scripts/pinterest_trend_researcher.py"]
    env_file: .env
    volumes:
      - ./output:/app/output

  # Step 2: Generate captions & metadata for the county's assets
  # Usage:
  #   docker compose run --rm pinterest-captions \
  #     --asset-dir output/pinterest/assets
  pinterest-captions:
    build: .
    entrypoint: ["python", "scripts/pinterest_caption_engine.py"]
    env_file: .env
    volumes:
      - ./output:/app/output

  # Step 3: Publish pins to Pinterest
  # Usage:
  #   docker compose run --rm pinterest-publish \
  #     --package output/pinterest/pin-package-2026-07-25.json --dry-run
  pinterest-publish:
    build: .
    entrypoint: ["python", "scripts/pinterest_publisher.py"]
    env_file: .env
    volumes:
      - ./output:/app/output

  # Step 4: Cross-post the brand's own TikToks to Pinterest
  # Usage:
  #   docker compose run --rm pinterest-repost \
  #     --urls-file county_tiktoks.txt --output-dir output/pinterest/assets
  pinterest-repost:
    build: .
    entrypoint: ["python", "scripts/pinterest_cross_reposter.py"]
    env_file: .env
    volumes:
      - ./output:/app/output

  # Step 0 (no keys needed): Build a pin package from the live store catalog
  # and the FSA plates on bandersnatch.world/history.html
  # Usage:
  #   docker compose run --rm pinterest-catalog --dry-run
  pinterest-catalog:
    build: .
    entrypoint: ["python", "scripts/pinterest_catalog_pins.py"]
    env_file: .env
    volumes:
      - ./output:/app/output
