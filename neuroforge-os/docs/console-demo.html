<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Florra Fleet Alpha Console</title>
<style>
/* NeuroForge Command Center
   Dark-surface console. Colour roles come from the project's validated
   palette: status hues are reserved and always ship with a written label,
   squad hues carry lane identity only. */

:root {
  color-scheme: dark;

  --plane:        #0d0d0d;
  --surface:      #1a1a19;
  --surface-2:    #212120;
  --surface-3:    #2a2a28;

  --ink:          #ffffff;
  --ink-2:        #c3c2b7;
  --ink-muted:    #898781;

  --hairline:     #2c2c2a;
  --rule:         #383835;
  --border:       rgba(255, 255, 255, 0.10);

  --accent:       #3987e5;
  --accent-soft:  rgba(57, 135, 229, 0.16);

  --good:         #0ca30c;
  --warning:      #fab219;
  --serious:      #ec835a;
  --critical:     #d03b3b;

  --radius:       10px;
  --radius-sm:    6px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--plane);
  color: var(--ink);
  font: 14px/1.5 var(--sans);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

h1, h2, h3 { margin: 0; font-weight: 600; }

button, select, input { font: inherit; color: inherit; }

button {
  cursor: pointer;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 5px 10px;
}
button:hover { background: var(--surface-3); }
button:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ── Top bar ─────────────────────────────────────────────────────────── */

.topbar {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 10px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
  flex: 0 0 auto;
}

.brand { display: flex; align-items: center; gap: 12px; min-width: 260px; }

.brand-mark {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 9px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 18px;
}

.brand-mark.is-callsign {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.03em;
}

.topbar h1 { font-size: 15px; letter-spacing: 0.01em; }

.brand-sub {
  margin: 1px 0 0;
  font-size: 11.5px;
  color: var(--ink-muted);
}

.kpis {
  display: flex;
  gap: 10px;
  flex: 1 1 auto;
  overflow-x: auto;
  scrollbar-width: thin;
}

.kpi {
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  min-width: 92px;
  flex: 0 0 auto;
}

.kpi-label {
  display: block;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-muted);
}

.kpi-value {
  display: block;
  font-size: 19px;
  font-weight: 600;
  line-height: 1.25;
}

.kpi-value .unit { font-size: 12px; color: var(--ink-2); font-weight: 500; }

.kpi-spark { display: block; margin-top: 2px; }

.link-state {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--ink-2);
  flex: 0 0 auto;
}

.link-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--ink-muted);
}
.link-dot[data-state="live"]        { background: var(--good); }
.link-dot[data-state="connecting"]  { background: var(--warning); }
.link-dot[data-state="lost"]        { background: var(--critical); }

/* ── Layout ──────────────────────────────────────────────────────────── */

.layout {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: 262px minmax(0, 1fr) 330px;
  gap: 12px;
  padding: 12px;
  min-height: 0;
}

.centre, .side {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--hairline);
  flex: 0 0 auto;
}

.panel-head h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-2);
}

.panel-note { font-size: 11.5px; color: var(--ink-muted); }

.panel-body {
  overflow: auto;
  padding: 10px 12px;
  min-height: 0;
  scrollbar-width: thin;
}

.map-panel   { flex: 1 1 64%; min-height: 320px; }
.timeline-panel { flex: 0 1 auto; max-height: 190px; }
.feed-panel  { flex: 1 1 26%; min-height: 140px; }
.autopilot-panel { flex: 0 0 auto; }
.launch-panel { flex: 0 0 auto; }
.runs-panel  { flex: 1 1 auto; min-height: 120px; }
.scores-panel { flex: 0 0 auto; max-height: 190px; }

.mini-toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--ink-2);
  cursor: pointer;
  user-select: none;
}
.mini-toggle input { accent-color: var(--accent); margin: 0; }

/* ── Fleet roster ────────────────────────────────────────────────────── */

.squad-block + .squad-block { margin-top: 14px; }

.squad-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--ink-muted);
  margin-bottom: 6px;
}

.squad-swatch { width: 8px; height: 8px; border-radius: 2px; }

.agent-row {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  padding: 6px 7px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: none;
}
.agent-row:hover { background: var(--surface-2); }
.agent-row[aria-current="true"] {
  background: var(--accent-soft);
  border-color: rgba(57, 135, 229, 0.4);
}

.agent-glyph { font-size: 13px; text-align: center; }

.agent-name {
  font-size: 12.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.agent-sub { font-size: 10.5px; color: var(--ink-muted); }

/* Status is a dot plus a written word — never colour alone. */
.status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  color: var(--ink-2);
  white-space: nowrap;
}

.status::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--ink-muted);
  flex: 0 0 auto;
}
.status[data-status="running"]::before { background: var(--accent); }
.status[data-status="queued"]::before  { background: var(--warning); }
.status[data-status="ok"]::before      { background: var(--good); }
.status[data-status="warn"]::before    { background: var(--serious); }
.status[data-status="error"]::before,
.status[data-status="cancelled"]::before { background: var(--critical); }
.status[data-status="unconfigured"]::before {
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--ink-muted);
}

.status[data-status="running"]::before { animation: pulse 1.4s ease-in-out infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.45; transform: scale(0.78); }
}

/* ── Architecture map ────────────────────────────────────────────────── */

.map-panel .panel-head { border-bottom-color: var(--hairline); }

.map-controls { display: flex; align-items: center; gap: 12px; }

.btn-group { display: flex; gap: 4px; }
.btn-group button { padding: 3px 9px; font-size: 12px; }

.map-shell {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  background:
    radial-gradient(circle at 1px 1px, var(--hairline) 1px, transparent 0) 0 0 / 26px 26px;
  cursor: grab;
}
.map-shell.dragging { cursor: grabbing; }

#map { display: block; }

.map-legend {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 7px 12px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  border-top: 1px solid var(--hairline);
  font-size: 11px;
  color: var(--ink-2);
  backdrop-filter: blur(3px);
}

.legend-item { display: inline-flex; align-items: center; gap: 6px; }

.legend-swatch { width: 18px; height: 2px; border-radius: 1px; background: var(--ink-2); }
.legend-swatch.review     { background: var(--serious); opacity: 0.75; }
.legend-swatch.dependency { background: var(--ink-muted); opacity: 0.7; }

/* Node visuals: squad hue tints the header strip, status owns the ring. */
.node-box {
  fill: var(--surface-2);
  stroke: var(--rule);
  stroke-width: 1;
}
.node-hit { cursor: pointer; }
.node-hit:hover .node-box { stroke: var(--ink-muted); }
.node-hit:focus-visible { outline: none; }
.node-hit:focus-visible .node-box { stroke: var(--accent); stroke-width: 2; }

.node-label { fill: var(--ink); font-size: 12px; font-weight: 600; }
.node-status { fill: var(--ink-2); font-size: 10px; }
.node-glyph { font-size: 13px; }

.node[data-status="running"] .node-box { stroke: var(--accent); stroke-width: 2; }
.node[data-status="queued"]  .node-box { stroke: var(--warning); }
.node[data-status="ok"]      .node-box { stroke: var(--good); }
.node[data-status="warn"]    .node-box { stroke: var(--serious); }
.node[data-status="error"]   .node-box,
.node[data-status="cancelled"] .node-box { stroke: var(--critical); }

.node[data-readiness="unconfigured"] .node-box { stroke-dasharray: 3 3; }
.node[data-readiness="unconfigured"] .node-label { fill: var(--ink-2); }

.node-halo {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  opacity: 0;
}
.node[data-status="running"] .node-halo { animation: halo 1.8s ease-out infinite; }

@keyframes halo {
  0%   { opacity: 0.55; transform: scale(1); }
  100% { opacity: 0;    transform: scale(1.06); }
}

.edge {
  fill: none;
  stroke: var(--rule);
  stroke-width: 1.5;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.edge[data-kind="review"] {
  stroke: var(--serious);
  stroke-width: 1.2;
  opacity: 0.42;
  stroke-dasharray: 2 4;
}
.edge[data-kind="dependency"] {
  stroke: var(--ink-muted);
  stroke-width: 1.2;
  opacity: 0.34;
  stroke-dasharray: 1 5;
}
.edge[data-active="true"] {
  stroke: var(--accent);
  stroke-width: 2.4;
  opacity: 1;
  stroke-dasharray: 7 6;
  animation: flow 0.85s linear infinite;
}

@keyframes flow { to { stroke-dashoffset: -26; } }

.edge-label {
  fill: var(--ink-muted);
  font-size: 10px;
  text-anchor: middle;
  dominant-baseline: middle;
}
.edge-label-bg { fill: var(--surface); }

.lane-head { fill: var(--ink-2); font-size: 10.5px; letter-spacing: 0.07em; }
.lane-rule { stroke-width: 2; stroke-linecap: round; }

.map-dim .node:not(.related) { opacity: 0.28; }
.map-dim .edge:not(.related) { opacity: 0.1; }

/* ── Mission timeline ────────────────────────────────────────────────── */

.timeline-row {
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr) 54px;
  align-items: center;
  gap: 10px;
  padding: 3px 0;
}

.timeline-name {
  font-size: 11.5px;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.timeline-track {
  position: relative;
  height: 14px;
  background: var(--surface-2);
  border-radius: 4px;
  overflow: hidden;
}

.timeline-bar {
  position: absolute;
  top: 0; bottom: 0;
  border-radius: 4px;
  background: var(--accent);
  min-width: 3px;
}
.timeline-bar[data-status="ok"]       { background: var(--good); }
.timeline-bar[data-status="warn"]     { background: var(--serious); }
.timeline-bar[data-status="error"]    { background: var(--critical); }
.timeline-bar[data-status="skipped"]  { background: var(--rule); }
.timeline-bar[data-status="running"]  { background: var(--accent); }

.timeline-meta {
  font-size: 11px;
  color: var(--ink-muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ── Live feed ───────────────────────────────────────────────────────── */

.feed { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; }

.feed-controls { display: flex; align-items: center; gap: 10px; }

.feed-controls select {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 3px 6px;
  font-size: 11.5px;
}

.feed-line {
  display: grid;
  grid-template-columns: 62px 92px minmax(0, 1fr);
  gap: 8px;
  padding: 1px 0;
  border-left: 2px solid transparent;
  padding-left: 6px;
}
.feed-line[data-level="warn"]    { border-left-color: var(--serious); }
.feed-line[data-level="error"]   { border-left-color: var(--critical); }
.feed-line[data-level="success"] { border-left-color: var(--good); }
.feed-line[data-level="event"]   { border-left-color: var(--accent); }

.feed-time  { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.feed-agent { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed-text  { white-space: pre-wrap; word-break: break-word; color: var(--ink-2); }
.feed-line[data-level="error"] .feed-text { color: #f0a3a3; }
.feed-line[data-level="event"] .feed-text { color: var(--ink); }

.feed-empty { color: var(--ink-muted); font-family: var(--sans); }

/* ── Launch console ──────────────────────────────────────────────────── */

.launch { display: flex; flex-direction: column; gap: 9px; }

.field { display: flex; flex-direction: column; gap: 4px; }

.field > span {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-muted);
}

.field select,
.field input[type="text"],
.field input[type="number"] {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  width: 100%;
}

.field-help { font-size: 10.5px; color: var(--ink-muted); margin: 0; }

.agent-blurb {
  margin: 0;
  font-size: 11.5px;
  color: var(--ink-2);
  min-height: 2.6em;
}

.flag-field { flex-direction: row; align-items: center; gap: 7px; }
.flag-field > span { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--ink-2); }

.sim-toggle { margin-top: 2px; }

.launch-button {
  background: var(--accent);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
  padding: 9px;
  border-radius: var(--radius-sm);
}
.launch-button:hover { background: #4b93e8; }
.launch-button:disabled { opacity: 0.5; cursor: not-allowed; }

.mode-pill {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--ink-2);
}
.mode-pill[data-mode="simulation"] { color: var(--warning); border-color: rgba(250, 178, 25, 0.4); }
.mode-pill[data-mode="live"]       { color: var(--good);    border-color: rgba(12, 163, 12, 0.4); }

.form-error { margin: 0; font-size: 11.5px; color: #f0a3a3; min-height: 1em; }

.blocked-note {
  margin: 0;
  font-size: 11px;
  color: var(--warning);
}

/* ── Autopilot ───────────────────────────────────────────────────────── */

.autopilot { display: flex; flex-direction: column; gap: 10px; }

.ap-objective {
  margin: 0;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.35;
}

.ap-detail { margin: 0; font-size: 11.5px; color: var(--ink-muted); min-height: 1em; }

.meter { display: flex; flex-direction: column; gap: 4px; }

.meter-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-muted);
}

.meter-head span:last-child {
  text-transform: none;
  letter-spacing: 0;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.meter-note { text-transform: none; letter-spacing: 0; opacity: 0.75; }

.meter-track {
  height: 8px;
  background: var(--surface-2);
  border-radius: 4px;
  overflow: hidden;
}

.meter-fill {
  height: 100%;
  width: 0;
  border-radius: 4px;
  background: var(--accent);
  transition: width 0.4s ease;
}
.meter-fill[data-tone="spend"]   { background: var(--good); }
.meter-fill[data-tone="warning"] { background: var(--warning); }
.meter-fill[data-tone="critical"]{ background: var(--critical); }

.ap-facts {
  margin: 0;
  display: grid;
  grid-template-columns: 62px minmax(0, 1fr);
  gap: 3px 10px;
}
.ap-facts dt {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-muted);
}
.ap-facts dd { margin: 0; font-size: 11.5px; color: var(--ink-2); }

.ap-controls { display: flex; gap: 6px; }
.ap-controls button { flex: 1 1 auto; font-size: 12px; }
.ap-controls button[data-primary="true"] {
  background: var(--accent);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
}
.ap-controls button[data-primary="true"]:hover { background: #4b93e8; }

.status[data-status="backoff"]::before,
.status[data-status="capped"]::before        { background: var(--warning); }
.status[data-status="halted"]::before,
.status[data-status="budget_reached"]::before { background: var(--critical); }
.status[data-status="paused"]::before,
.status[data-status="backlog_empty"]::before  { background: var(--ink-muted); }

/* ── Runs list ───────────────────────────────────────────────────────── */

.run-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 8px;
  width: 100%;
  text-align: left;
  padding: 7px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: none;
}
.run-row:hover { background: var(--surface-2); }
.run-row[aria-current="true"] { background: var(--accent-soft); border-color: rgba(57,135,229,0.4); }

.run-title { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run-meta { grid-column: 1 / -1; font-size: 10.5px; color: var(--ink-muted); }
.run-cancel { padding: 2px 8px; font-size: 11px; }

.empty {
  color: var(--ink-muted);
  font-size: 12px;
  padding: 6px 0;
}

/* ── QA by agent (horizontal bars, single sequential hue) ────────────── */

.score-row {
  display: grid;
  grid-template-columns: 118px minmax(0, 1fr) 40px;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
}

.score-name {
  font-size: 11.5px;
  color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.score-track { height: 10px; background: var(--surface-2); border-radius: 5px; }

.score-bar {
  height: 100%;
  border-radius: 5px;
  background: var(--accent);
  min-width: 3px;
}

.score-value {
  font-size: 11.5px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
}

/* ── Drawer ──────────────────────────────────────────────────────────── */

.drawer { position: fixed; inset: 0; z-index: 50; }

.drawer-scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55); }

.drawer-panel {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: min(420px, 100%);
  background: var(--surface);
  border-left: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
}

.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--hairline);
}

.drawer-head h2 { font-size: 15px; }

.drawer-body { padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }

.drawer-body dl { margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 5px 10px; }
.drawer-body dt { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.drawer-body dd { margin: 0; font-size: 12.5px; color: var(--ink-2); word-break: break-word; }

.drawer-body p { margin: 0; font-size: 12.5px; color: var(--ink-2); }

.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--ink-2);
}
.chip[data-tone="warn"] { color: var(--warning); border-color: rgba(250, 178, 25, 0.35); }

.artifact-list { margin: 0; padding-left: 16px; font-size: 11.5px; color: var(--ink-2); font-family: var(--mono); }

/* ── Responsive ──────────────────────────────────────────────────────── */

@media (max-width: 1240px) {
  body { overflow: auto; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .roster, .map-panel { max-height: 420px; }
  .side { flex-direction: row; flex-wrap: wrap; }
  .side > .panel { flex: 1 1 280px; }
}

@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; gap: 12px; }
  .brand { min-width: 0; }
  .side { flex-direction: column; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .edge[data-active="true"] { stroke-dasharray: none; }
}


.replay-chip {
  font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--warning); border: 1px solid rgba(250, 178, 25, 0.4);
  border-radius: 999px; padding: 3px 10px; white-space: nowrap;
  font-family: var(--mono);
}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" id="brand-mark" aria-hidden="true">⌘</span>
    <div>
      <h1>NeuroForge Command Center</h1>
      <p class="brand-sub" id="brand-sub">connecting…</p>
    </div>
  </div>

  <div class="kpis" id="kpis" role="group" aria-label="Fleet metrics"></div>

  <div class="link-state">
    <span class="link-dot" id="link-dot" data-state="connecting" aria-hidden="true"></span>
    <span id="link-label">connecting</span>
  </div>
</header>

<main class="layout">

  <!-- ── Fleet roster ────────────────────────────────────────────────── -->
  <section class="panel roster" aria-labelledby="roster-title">
    <div class="panel-head">
      <h2 id="roster-title">Fleet</h2>
      <label class="mini-toggle">
        <input type="checkbox" id="only-live">
        <span>active only</span>
      </label>
    </div>
    <div class="panel-body" id="roster"></div>
  </section>

  <!-- ── Centre column ──────────────────────────────────────────────── -->
  <div class="centre">

    <section class="panel map-panel" aria-labelledby="map-title">
      <div class="panel-head">
        <h2 id="map-title">Architecture</h2>
        <div class="map-controls">
          <label class="mini-toggle">
            <input type="checkbox" id="show-review" checked>
            <span>QA review</span>
          </label>
          <label class="mini-toggle">
            <input type="checkbox" id="show-dependency">
            <span>dependencies</span>
          </label>
          <div class="btn-group">
            <button type="button" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
            <button type="button" id="zoom-fit" title="Fit to view">fit</button>
            <button type="button" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          </div>
        </div>
      </div>
      <div class="map-shell" id="map-shell">
        <svg id="map" role="img" aria-labelledby="map-title map-desc">
          <desc id="map-desc">Live map of the NeuroForge agent fleet. Each box is
            an agent; its status is written inside it. Solid lines carry work,
            faint lines are QA reviews and external dependencies.</desc>
        </svg>
        <div class="map-legend" id="map-legend"></div>
      </div>
    </section>

    <section class="panel timeline-panel" aria-labelledby="timeline-title">
      <div class="panel-head">
        <h2 id="timeline-title">Mission timeline</h2>
        <span class="panel-note" id="timeline-note">no run selected</span>
      </div>
      <div class="panel-body" id="timeline"></div>
    </section>

    <section class="panel feed-panel" aria-labelledby="feed-title">
      <div class="panel-head">
        <h2 id="feed-title">Live feed</h2>
        <div class="feed-controls">
          <label class="mini-toggle">
            <input type="checkbox" id="follow" checked>
            <span>follow</span>
          </label>
          <select id="feed-filter" aria-label="Filter feed by level">
            <option value="all">everything</option>
            <option value="event">events only</option>
            <option value="warn">warnings &amp; errors</option>
          </select>
        </div>
      </div>
      <div class="panel-body feed" id="feed" role="log" aria-live="polite"></div>
    </section>
  </div>

  <!-- ── Command column ─────────────────────────────────────────────── -->
  <div class="side">
    <section class="panel autopilot-panel" aria-labelledby="autopilot-title">
      <div class="panel-head">
        <h2 id="autopilot-title">Autopilot</h2>
        <span class="status" id="ap-status" data-status="idle">idle</span>
      </div>
      <div class="panel-body autopilot" id="autopilot">
        <p class="ap-objective" id="ap-objective">—</p>
        <p class="ap-detail" id="ap-detail"></p>

        <div class="meter">
          <div class="meter-head">
            <span>mission book</span>
            <span id="ap-book-value">—</span>
          </div>
          <div class="meter-track"><div class="meter-fill" id="ap-book-bar"></div></div>
        </div>

        <div class="meter">
          <div class="meter-head">
            <span>budget <span class="meter-note">estimated</span></span>
            <span id="ap-budget-value">—</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill" id="ap-budget-bar" data-tone="spend"></div>
          </div>
        </div>

        <dl class="ap-facts">
          <dt>next</dt><dd id="ap-next">—</dd>
          <dt>today</dt><dd id="ap-today">—</dd>
          <dt>learning</dt><dd id="ap-learning">—</dd>
        </dl>

        <div class="ap-controls">
          <button type="button" id="ap-toggle">Start</button>
          <button type="button" id="ap-skip">Skip objective</button>
        </div>
        <p class="form-error" id="ap-error" role="alert"></p>
      </div>
    </section>

    <section class="panel launch-panel" aria-labelledby="launch-title">
      <div class="panel-head">
        <h2 id="launch-title">Launch</h2>
        <span class="mode-pill" id="mode-pill">—</span>
      </div>
      <form class="panel-body launch" id="launch-form">
        <label class="field">
          <span>Agent</span>
          <select id="launch-agent" required></select>
        </label>
        <p class="agent-blurb" id="launch-blurb"></p>
        <div id="launch-params"></div>
        <label class="mini-toggle sim-toggle">
          <input type="checkbox" id="launch-simulate">
          <span>simulate this run</span>
        </label>
        <button type="submit" class="launch-button" id="launch-button">Deploy agent</button>
        <p class="form-error" id="launch-error" role="alert"></p>
      </form>
    </section>

    <section class="panel runs-panel" aria-labelledby="runs-title">
      <div class="panel-head">
        <h2 id="runs-title">Runs</h2>
        <span class="panel-note" id="runs-note"></span>
      </div>
      <div class="panel-body" id="runs"></div>
    </section>

    <section class="panel scores-panel" aria-labelledby="scores-title">
      <div class="panel-head">
        <h2 id="scores-title">QA by agent</h2>
        <span class="panel-note">out of 50</span>
      </div>
      <div class="panel-body" id="scores"></div>
    </section>
  </div>
</main>

<!-- Agent detail drawer -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-scrim" id="drawer-scrim"></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <header class="drawer-head">
      <h2 id="drawer-title">Agent</h2>
      <button type="button" id="drawer-close" aria-label="Close">✕</button>
    </header>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
</div>

  const json = (body, status = 200) => new Response(JSON.stringify(body), {

  let listeners = [];
  let timers = [];
  let running = false;

  function stopReplay() {

  /* The runs panel re-fetches on lifecycle events, so the baked snapshot has
     to move with the replay or it would contradict the feed beside it. */
  function syncRun(event) {
    const run = (SNAPSHOT.runs.runs || [])[0];
    if (!run || event.run_id !== run.id) return;
    if (event.type === 'run.started') {
      run.status = 'running';
      run.started_at = Date.now() / 1000;
    } else if (event.type === 'run.finished' || event.type === 'run.cancelled') {
      run.status = event.status || 'ok';
      run.finished_at = Date.now() / 1000;
      run.scores = event.scores || {};
      run.artifacts = event.artifacts || [];
    }

  function startReplay() {
    stopReplay();
    const run = (SNAPSHOT.runs.runs || [])[0];
    if (run) { run.status = 'queued'; run.started_at = null; run.finished_at = null; }

      timers.push(setTimeout(() => {
        const payload = { ...event, ts: Date.now() / 1000, seq: index + 1 };
        syncRun(payload);
        listeners.forEach((fn) => fn({ data: JSON.stringify(payload) }));
        if (index === EVENTS.length - 1) running = false;
      }, event.at));

  const route = (path) => {
    if (path.startsWith('/api/health')) return SNAPSHOT.health;
    if (path.startsWith('/api/fleet')) return SNAPSHOT.fleet;
    if (path.startsWith('/api/graph')) return SNAPSHOT.graph;
    if (path.startsWith('/api/metrics')) {
      // Polled on a timer, so it has to follow the replay rather than report
      // a frozen count beside a run that is visibly in flight.
      const run = (SNAPSHOT.runs.runs || [])[0] || {};

          SNAPSHOT.autopilot = {

    constructor() {

      this.onopen = null;
      this.onerror = null;

      listeners = listeners.filter((fn) => fn !== this._push);
    }
  };

  // Say plainly what this is, in the interface rather than only in a caption.
  window.addEventListener('DOMContentLoaded', () => {
    const bar = document.querySelector('.link-state');
    if (!bar) return;
    const chip = document.createElement('span');
    chip.className = 'replay-chip';
    chip.textContent = 'recorded · read-only';
    chip.title = 'A recorded mission playing back. No agents run here.';
    bar.parentNode.insertBefore(chip, bar);

    const launch = document.getElementById('launch-button');
    if (launch) launch.textContent = 'Replay mission';
    const blurb = document.getElementById('launch-blurb');
    if (blurb) {
      blurb.dataset.replay = '1';
    }
  });
})();

<script>
/* Fleet map renderer.
 *
 * Draws the validated IR the server produced and nothing more — no layout
 * decisions happen here, so what you see is exactly what the validator
 * checked. The renderer only owns presentation: zoom, pan, hover tracing,
 * edge-class filtering and live status.
 */

const SVG_NS = 'http://www.w3.org/2000/svg';
const CORNER_RADIUS = 9;

function el(name, attrs = {}, parent = null) {
  const node = document.createElementNS(SVG_NS, name);
  for (const [key, value] of Object.entries(attrs)) {
    if (value !== null && value !== undefined) node.setAttribute(key, String(value));
  }
  if (parent) parent.appendChild(node);
  return node;
}

/* Orthogonal polyline with rounded corners. */
function orthPath(points, radius = CORNER_RADIUS) {
  if (points.length < 2) return '';
  let d = `M ${points[0][0]} ${points[0][1]}`;
  for (let i = 1; i < points.length - 1; i += 1) {
    const [px, py] = points[i - 1];
    const [cx, cy] = points[i];
    const [nx, ny] = points[i + 1];
    const inLen = Math.hypot(cx - px, cy - py);
    const outLen = Math.hypot(nx - cx, ny - cy);
    const r = Math.min(radius, inLen / 2, outLen / 2);
    if (r < 1) { d += ` L ${cx} ${cy}`; continue; }
    const ax = cx - ((cx - px) / (inLen || 1)) * r;
    const ay = cy - ((cy - py) / (inLen || 1)) * r;
    const bx = cx + ((nx - cx) / (outLen || 1)) * r;
    const by = cy + ((ny - cy) / (outLen || 1)) * r;
    d += ` L ${ax} ${ay} Q ${cx} ${cy} ${bx} ${by}`;
  }
  const last = points[points.length - 1];
  return `${d} L ${last[0]} ${last[1]}`;
}

function curvePath(points) {
  const [a, c1, c2, b] = points;
  return `M ${a[0]} ${a[1]} C ${c1[0]} ${c1[1]}, ${c2[0]} ${c2[1]}, ${b[0]} ${b[1]}`;
}

function truncate(text, max) {
  return text.length > max ? `${text.slice(0, max - 1)}…` : text;
}

class FleetMap {
  constructor(svg, shell, { onSelect } = {}) {
    this.svg = svg;
    this.shell = shell;
    this.onSelect = onSelect || (() => {});
    this.ir = null;
    this.nodeEls = new Map();
    this.edgeEls = new Map();
    this.view = { x: 0, y: 0, w: 100, h: 100 };
    this.selected = null;
    this.filters = { review: true, dependency: false };
    this._bindInteractions();
  }

  /* ── rendering ───────────────────────────────────────────────────── */

  render(ir) {
    this.ir = ir;
    this.svg.replaceChildren();
    this.nodeEls.clear();
    this.edgeEls.clear();

    this.svg.setAttribute('width', '100%');
    this.svg.setAttribute('height', '100%');
    this.svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    this._defs();
    this.root = el('g', { class: 'map-root' }, this.svg);

    this._drawLanes();
    this.edgeLayer = el('g', { class: 'edge-layer' }, this.root);
    this.labelLayer = el('g', { class: 'label-layer' }, this.root);
    this.nodeLayer = el('g', { class: 'node-layer' }, this.root);

    ir.edges.forEach((edge) => this._drawEdge(edge));
    ir.nodes.forEach((node) => this._drawNode(node));

    this.applyFilters(this.filters);
    this.fit();
  }

  _defs() {
    const defs = el('defs', {}, this.svg);
    const markers = [
      ['arrow-flow', 'var(--rule)'],
      ['arrow-active', 'var(--accent)'],
      ['arrow-review', 'var(--serious)'],
      ['arrow-dependency', 'var(--ink-muted)'],
    ];
    for (const [id, fill] of markers) {
      const marker = el('marker', {
        id, viewBox: '0 0 8 8', refX: 7, refY: 4,
        markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse',
      }, defs);
      el('path', { d: 'M 0 0 L 8 4 L 0 8 z', fill }, marker);
    }
  }

  _drawLanes() {
    const layer = el('g', { class: 'lane-layer' }, this.root);
    for (const lane of this.ir.lanes) {
      el('line', {
        class: 'lane-rule',
        x1: lane.x, y1: lane.y + 7, x2: lane.x + 26, y2: lane.y + 7,
        stroke: lane.accent,
      }, layer);
      const text = el('text', {
        class: 'lane-head', x: lane.x + 34, y: lane.y + 11,
      }, layer);
      text.textContent = lane.name.toUpperCase();
    }
  }

  _drawEdge(edge) {
    const path = el('path', {
      class: 'edge',
      'data-kind': edge.kind,
      'data-from': edge.from,
      'data-to': edge.to,
      d: edge.render === 'curve' ? curvePath(edge.points) : orthPath(edge.points),
      'marker-end': `url(#arrow-${edge.kind === 'flow' ? 'flow' : edge.kind})`,
    }, this.edgeLayer);
    this.edgeEls.set(edge.id, { el: path, edge });

    if (edge.label && edge.label_point) {
      const [lx, ly] = edge.label_point;
      const width = Math.max(28, edge.label.length * 5.8) + 12;
      el('rect', {
        class: 'edge-label-bg',
        x: lx - width / 2, y: ly - 7.5, width, height: 15, rx: 4,
      }, this.labelLayer);
      const text = el('text', { class: 'edge-label', x: lx, y: ly }, this.labelLayer);
      text.textContent = edge.label;
    }
  }

  _drawNode(node) {
    const group = el('g', {
      class: 'node',
      'data-id': node.id,
      'data-status': node.state?.status || 'idle',
      'data-readiness': node.readiness,
      transform: `translate(${node.x} ${node.y})`,
    }, this.nodeLayer);

    const hit = el('g', {
      class: 'node-hit',
      tabindex: '0',
      role: 'button',
      'aria-label': `${node.label} — ${node.summary}`,
    }, group);

    el('rect', {
      class: 'node-halo',
      x: -3, y: -3, width: node.w + 6, height: node.h + 6, rx: 10,
      style: 'transform-origin: center; transform-box: fill-box;',
    }, hit);

    el('rect', {
      class: 'node-box', x: 0, y: 0, width: node.w, height: node.h, rx: 8,
    }, hit);

    // Squad hue lives on a thin strip; it never encodes status.
    el('rect', {
      x: 0, y: 0, width: 3.5, height: node.h, rx: 1.5, fill: node.accent,
    }, hit);

    const glyph = el('text', {
      class: 'node-glyph', x: 14, y: 24, fill: node.accent,
    }, hit);
    glyph.textContent = node.glyph;

    const label = el('text', { class: 'node-label', x: 34, y: 24 }, hit);
    label.textContent = truncate(node.label, 20);

    const status = el('text', { class: 'node-status', x: 14, y: 42 }, hit);
    status.textContent = this._statusText(node.state, node.readiness);
    this.nodeEls.set(node.id, { group, status, node });

    const title = el('title', {}, hit);
    title.textContent = `${node.label}\n${node.summary}`;

    hit.addEventListener('click', () => this.select(node.id));
    hit.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        this.select(node.id);
      }
    });
    hit.addEventListener('pointerenter', () => this._trace(node.id));
    hit.addEventListener('pointerleave', () => this._trace(this.selected));
  }

  _statusText(state, readiness) {
    const status = state?.status || 'idle';
    if (status === 'idle' && readiness === 'unconfigured') return 'no credentials';
    const detail = state?.detail;
    if (detail && status === 'running') return truncate(detail, 24);
    if (state?.last_score && (status === 'ok' || status === 'warn')) {
      return `${status} · ${state.last_score}/50`;
    }
    return status;
  }

  /* ── live updates ────────────────────────────────────────────────── */

  setAgentState(agentId, state) {
    const entry = this.nodeEls.get(agentId);
    if (!entry) return;
    entry.node.state = state;
    entry.group.setAttribute('data-status', state.status || 'idle');
    entry.status.textContent = this._statusText(state, entry.node.readiness);
    this._refreshActiveEdges();
  }

  _refreshActiveEdges() {
    const live = new Set();
    for (const [id, entry] of this.nodeEls) {
      if (entry.node.state?.status === 'running') live.add(id);
    }
    for (const { el: path, edge } of this.edgeEls.values()) {
      // An edge is "carrying work" when its downstream end is running.
      const active = live.has(edge.to) && edge.kind === 'flow';
      if (active) path.setAttribute('data-active', 'true');
      else path.removeAttribute('data-active');
    }
  }

  /* ── interaction ─────────────────────────────────────────────────── */

  select(agentId) {
    this.selected = this.selected === agentId ? null : agentId;
    this._trace(this.selected);
    this.onSelect(this.selected);
  }

  setSelected(agentId) {
    this.selected = agentId;
    this._trace(agentId);
  }

  _trace(agentId) {
    const root = this.root;
    if (!root) return;
    root.classList.toggle('map-dim', Boolean(agentId));
    for (const { group } of this.nodeEls.values()) group.classList.remove('related');
    for (const { el: path } of this.edgeEls.values()) path.classList.remove('related');
    if (!agentId) return;

    const related = new Set([agentId]);
    for (const { el: path, edge } of this.edgeEls.values()) {
      if (edge.from === agentId || edge.to === agentId) {
        path.classList.add('related');
        related.add(edge.from);
        related.add(edge.to);
      }
    }
    for (const id of related) this.nodeEls.get(id)?.group.classList.add('related');
  }

  applyFilters(filters) {
    this.filters = { ...this.filters, ...filters };
    for (const { el: path, edge } of this.edgeEls.values()) {
      const visible = edge.kind === 'flow'
        || (edge.kind === 'review' && this.filters.review)
        || (edge.kind === 'dependency' && this.filters.dependency);
      path.style.display = visible ? '' : 'none';
    }
  }

  /* ── viewport ────────────────────────────────────────────────────── */

  fit() {
    if (!this.ir) return;
    const pad = 16;
    this._setView({
      x: -pad, y: -pad,
      w: this.ir.width + pad * 2,
      h: this.ir.height + pad * 2,
    });
  }

  zoom(factor, origin) {
    const { x, y, w, h } = this.view;
    const nw = Math.max(240, Math.min(this.ir.width * 3, w * factor));
    const nh = nw * (h / w);
    const ox = origin ? origin.x : x + w / 2;
    const oy = origin ? origin.y : y + h / 2;
    this._setView({
      x: ox - ((ox - x) * nw) / w,
      y: oy - ((oy - y) * nh) / h,
      w: nw, h: nh,
    });
  }

  _setView(view) {
    this.view = view;
    this.svg.setAttribute(
      'viewBox',
      `${view.x.toFixed(1)} ${view.y.toFixed(1)} ${view.w.toFixed(1)} ${view.h.toFixed(1)}`,
    );
  }

  _toUser(event) {
    const rect = this.svg.getBoundingClientRect();
    if (!rect.width || !rect.height) return { x: 0, y: 0 };
    // preserveAspectRatio meet: the shorter axis is letterboxed.
    const scale = Math.max(this.view.w / rect.width, this.view.h / rect.height);
    const offsetX = (rect.width - this.view.w / scale) / 2;
    const offsetY = (rect.height - this.view.h / scale) / 2;
    return {
      x: this.view.x + (event.clientX - rect.left - offsetX) * scale,
      y: this.view.y + (event.clientY - rect.top - offsetY) * scale,
    };
  }

  _bindInteractions() {
    let dragging = null;

    this.shell.addEventListener('pointerdown', (event) => {
      if (event.target.closest('.node-hit')) return;
      dragging = { x: event.clientX, y: event.clientY, view: { ...this.view } };
      this.shell.classList.add('dragging');
      this.shell.setPointerCapture(event.pointerId);
    });

    this.shell.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      const rect = this.svg.getBoundingClientRect();
      const scale = this.view.w / (rect.width || 1);
      this._setView({
        ...this.view,
        x: dragging.view.x - (event.clientX - dragging.x) * scale,
        y: dragging.view.y - (event.clientY - dragging.y) * scale,
      });
    });

    const endDrag = (event) => {
      if (!dragging) return;
      dragging = null;
      this.shell.classList.remove('dragging');
      try { this.shell.releasePointerCapture(event.pointerId); } catch { /* ignore */ }
    };
    this.shell.addEventListener('pointerup', endDrag);
    this.shell.addEventListener('pointercancel', endDrag);

    this.shell.addEventListener('wheel', (event) => {
      if (!this.ir) return;
      event.preventDefault();
      this.zoom(event.deltaY > 0 ? 1.12 : 0.89, this._toUser(event));
    }, { passive: false });
  }
}

window.FleetMap = FleetMap;

</script>

<script>
/* Command center controller.
 *
 * Boots from REST snapshots, then keeps itself current from the event stream.
 * Every event carries a sequence number, so a dropped connection resumes from
 * the last one applied rather than losing the middle of a mission.
 */

(() => {
  const $ = (id) => document.getElementById(id);
  const MAX_FEED = 500;

  const state = {
    cursor: 0,
    link: 'connecting',
    simulateMode: false,
    fleet: null,
    agents: new Map(),
    runs: [],
    runsById: new Map(),
    stagesByRun: new Map(),
    metrics: null,
    autopilot: null,
    profile: null,
    selectedAgent: null,
    selectedRun: null,
    feed: [],
    feedFilter: 'all',
    follow: true,
  };

  let map;
  let source;
  let retryDelay = 1000;

  /* ── helpers ───────────────────────────────────────────────────────── */

  // When the commander is started with --token, the console carries it in its
  // own URL; every request and the event stream reuse it from there.
  const TOKEN = new URLSearchParams(location.search).get('token') || '';

  const withToken = (path) => {
    if (!TOKEN) return path;
    return path + (path.includes('?') ? '&' : '?') + `token=${encodeURIComponent(TOKEN)}`;
  };

  const api = async (path, options) => {
    const headers = { 'Content-Type': 'application/json' };
    if (TOKEN) headers.Authorization = `Bearer ${TOKEN}`;
    const response = await fetch(withToken(path), { headers, ...options });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error || `request failed (${response.status})`);
    return body;
  };

  const clock = (ts) => new Date((ts || 0) * 1000).toLocaleTimeString([], {
    hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit',
  });

  const duration = (seconds) => {
    if (seconds === null || seconds === undefined) return '—';
    if (seconds < 1) return `${Math.round(seconds * 1000)}ms`;
    if (seconds < 60) return `${seconds.toFixed(1)}s`;
    const mins = Math.floor(seconds / 60);
    return `${mins}m ${String(Math.round(seconds % 60)).padStart(2, '0')}s`;
  };

  const ago = (ts) => {
    if (!ts) return '—';
    const delta = Date.now() / 1000 - ts;
    if (delta < 60) return `${Math.max(0, Math.round(delta))}s ago`;
    if (delta < 3600) return `${Math.round(delta / 60)}m ago`;
    if (delta < 86400) return `${Math.round(delta / 3600)}h ago`;
    return `${Math.round(delta / 86400)}d ago`;
  };

  const node = (tag, className, text) => {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  };

  /* ── boot ──────────────────────────────────────────────────────────── */

  async function boot() {
    map = new window.FleetMap($('map'), $('map-shell'), {
      onSelect: (agentId) => {
        state.selectedAgent = agentId;
        renderRoster();
        if (agentId) openDrawer(agentId); else closeDrawer();
      },
    });

    bindControls();

    try {
      const health = await api('/api/health');
      // Open with recent history rather than a blank feed: an unattended fleet
      // has usually already done something by the time anyone looks.
      state.cursor = Math.max(0, (health.cursor || 0) - 200);
      state.simulateMode = Boolean(health.simulate);
    } catch (error) {
      setLink('lost', error.message);
    }

    await Promise.all([refreshFleet(), refreshRuns(), refreshMetrics(),
                       refreshAutopilot()]);
    await refreshGraph();
    renderFeed();
    connect();

    // Metrics come from files on disk, so they are polled rather than pushed.
    setInterval(refreshMetrics, 20000);
    setInterval(renderRuns, 10000);
    // The countdown to the next mission ticks locally; state changes arrive
    // as events, so this only needs to refresh the clock.
    setInterval(() => {
      if (state.autopilot) $('ap-next').textContent = nextActionText(state.autopilot);
    }, 1000);
  }

  async function refreshFleet() {
    const fleet = await api('/api/fleet');
    state.fleet = fleet;
    state.profile = fleet.profile || null;
    state.agents = new Map(fleet.agents.map((agent) => [agent.id, agent]));
    renderRoster();
    renderLaunchAgents();
    updateModePill();
    renderKpis();
    applyBranding();
  }

  async function refreshAutopilot() {
    state.autopilot = await api('/api/autopilot');
    renderAutopilot();
  }

  function applyBranding() {
    const profile = state.profile;
    if (!profile) return;
    document.title = `${profile.name} — Command Center`;
    document.querySelector('.topbar h1').textContent = profile.name;
    $('brand-mark').textContent = profile.callsign;
    $('brand-mark').classList.add('is-callsign');

    const lineage = profile.derived_from ? `cloned from ${profile.derived_from} · ` : '';
    $('brand-sub').textContent = state.simulateMode
      ? `${lineage}simulation mode — no API calls, no writes`
      : `${lineage}${state.agents.size} agents under command`;
  }

  async function refreshGraph() {
    const payload = await api('/api/graph');
    map.render(payload.ir);
    map.applyFilters({
      review: $('show-review').checked,
      dependency: $('show-dependency').checked,
    });
    renderLegend(payload.validation);
    for (const agent of state.agents.values()) {
      map.setAgentState(agent.id, agent.state || { status: 'idle' });
    }
  }

  async function refreshRuns() {
    const payload = await api('/api/runs?limit=40');
    state.runs = payload.runs;
    state.runsById = new Map(payload.runs.map((run) => [run.id, run]));
    for (const run of payload.runs) {
      if (run.stages?.length) state.stagesByRun.set(run.id, run.stages);
    }
    if (!state.selectedRun && payload.runs.length) selectRun(payload.runs[0].id, false);
    renderRuns();
  }

  async function refreshMetrics() {
    try {
      state.metrics = await api('/api/metrics');
      renderKpis();
      renderScores();
    } catch { /* a metrics hiccup must not blank the console */ }
  }

  /* ── event stream ──────────────────────────────────────────────────── */

  function connect() {
    if (source) source.close();
    setLink('connecting');
    source = new EventSource(withToken(`/api/events?since=${state.cursor}`));

    source.onopen = () => { retryDelay = 1000; setLink('live'); };

    source.onmessage = (message) => {
      let event;
      try { event = JSON.parse(message.data); } catch { return; }
      if (event.type === 'heartbeat') { setLink('live'); return; }
      if (event.seq) state.cursor = Math.max(state.cursor, event.seq);
      applyEvent(event);
    };

    source.onerror = () => {
      setLink('lost');
      source.close();
      // Reconnect from the last applied cursor so nothing is missed.
      setTimeout(connect, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 15000);
    };
  }

  function setLink(status, detail) {
    state.link = status;
    $('link-dot').dataset.state = status;
    $('link-label').textContent = status === 'live' ? 'live' : status;
    if (detail) $('brand-sub').textContent = detail;
  }

  function applyEvent(event) {
    switch (event.type) {
      case 'fleet': {
        const agent = state.agents.get(event.agent);
        if (agent) {
          agent.state = event.state || { status: event.status };
          map.setAgentState(agent.id, agent.state);
          renderRoster();
        }
        break;
      }

      case 'run.queued':
      case 'run.started': {
        pushFeed(event, `${event.agent_name} ${event.type === 'run.queued' ? 'queued' : 'started'}`
          + (event.simulated ? ' (simulated)' : ''), 'event');
        refreshRuns().catch(() => {});
        if (event.type === 'run.started') selectRun(event.run_id, false);
        break;
      }

      case 'run.log':
        pushFeed(event, event.line, event.level || 'info');
        break;

      case 'stage.started': {
        const stages = state.stagesByRun.get(event.run_id) || [];
        stages.push({
          name: event.stage, agent: event.agent, started_at: event.ts,
          finished_at: null, status: 'running', score: null,
        });
        state.stagesByRun.set(event.run_id, stages);
        pushFeed(event, `▸ ${event.stage}${event.detail ? ` — ${event.detail}` : ''}`, 'event');
        renderTimeline();
        break;
      }

      case 'stage.finished': {
        const stages = state.stagesByRun.get(event.run_id) || [];
        for (let i = stages.length - 1; i >= 0; i -= 1) {
          if (stages[i].name === event.stage) {
            stages[i].finished_at = event.ts;
            stages[i].status = event.status;
            break;
          }
        }
        renderTimeline();
        break;
      }

      case 'metric': {
        if (event.metric === 'qa_score' && !event.rollup) {
          const stages = state.stagesByRun.get(event.run_id) || [];
          const open = stages.filter((s) => s.finished_at === null);
          const target = open.length ? open[open.length - 1] : stages[stages.length - 1];
          if (target) target.score = event.value;
          pushFeed(event, `${event.label}: ${event.value}/50`,
            event.failed ? 'warn' : 'event');
          renderTimeline();
        }
        break;
      }

      case 'artifact':
        pushFeed(event, `saved ${event.path}`, 'event');
        break;

      case 'run.finished':
      case 'run.cancelled': {
        pushFeed(event,
          `${event.agent_name} ${event.status} in ${duration(event.duration)}`,
          event.status === 'error' ? 'error' : 'event');
        refreshRuns().catch(() => {});
        refreshMetrics();
        break;
      }

      default:
        if (event.type.startsWith('autopilot.')) applyAutopilotEvent(event);
        break;
    }
  }

  function applyAutopilotEvent(event) {
    if (event.state) {
      state.autopilot = event.state;
      renderAutopilot();
    }

    const notes = {
      'autopilot.dispatched': () => event.kind === 'optimize'
        ? 'autopilot: optimizing prompts from QA history'
        : `autopilot: launching ${event.objective} · ${event.faculty}`,
      'autopilot.completed': () =>
        `autopilot: ${event.objective} complete (avg ${event.average}/50)`,
      'autopilot.rework': () =>
        `autopilot: ${event.objective} scored ${event.average}/50 — reworking`,
      'autopilot.quarantined': () =>
        `autopilot: ${event.objective} held at ${event.average}/50 — needs review`,
      'autopilot.optimized': () =>
        `autopilot: optimizer ${event.status}` +
        `${event.applied ? ' (prompts rewritten)' : ' (proposals logged)'}`,
      'autopilot.optimizer_skipped': () => `autopilot: optimizer unavailable — ${event.detail}`,
      'autopilot.failed': () =>
        `autopilot: ${event.detail} (${event.consecutive} in a row)`,
      'autopilot.status': () => `autopilot: ${event.status}${event.detail ? ` — ${event.detail}` : ''}`,
      'autopilot.error': () => `autopilot error: ${event.detail}`,
      'autopilot.skipped': () => 'autopilot: objective skipped by operator',
    };

    const note = notes[event.type];
    if (!note) return;
    const level = ['autopilot.failed', 'autopilot.error'].includes(event.type) ? 'error'
      : ['autopilot.rework', 'autopilot.quarantined'].includes(event.type) ? 'warn'
        : 'event';
    pushFeed({ ...event, agent: 'autopilot' }, note(), level);
  }

  /* ── Autopilot ─────────────────────────────────────────────────────── */

  // Statuses the fleet stops itself in and will not leave without an operator.
  const AP_STOPPED = ['idle', 'paused', 'halted', 'budget_reached', 'backlog_empty'];

  const AP_EXPLAIN = {
    idle: 'Held. Nothing dispatches until you start it.',
    running: 'Working the mission book.',
    paused: 'Held by operator.',
    backoff: 'Backing off after a failure.',
    capped: 'Daily mission cap reached — resumes tomorrow.',
    budget_reached: 'Budget ceiling reached. Raise it to continue.',
    backlog_empty: 'Mission book complete.',
    halted: 'Stopped after repeated failures — needs a look.',
  };

  function renderAutopilot() {
    const ap = state.autopilot;
    if (!ap) return;

    const badge = $('ap-status');
    badge.dataset.status = ap.status;
    badge.textContent = ap.status.replace('_', ' ');

    $('ap-objective').textContent = ap.objective
      ? `${ap.objective} · ${ap.faculty}`
      : (ap.status === 'backlog_empty' ? 'Mission book complete' : 'No objective');

    $('ap-detail').textContent = ap.detail || AP_EXPLAIN[ap.status] || '';

    const bookPct = ap.backlog_total
      ? (ap.settled / ap.backlog_total) * 100 : 0;
    $('ap-book-bar').style.width = `${bookPct.toFixed(1)}%`;
    const bookNotes = [];
    if (ap.preexisting) bookNotes.push(`${ap.preexisting} pre-existing`);
    if (ap.quarantined) bookNotes.push(`${ap.quarantined} held`);
    $('ap-book-value').textContent = `${ap.settled}/${ap.backlog_total}`
      + (bookNotes.length ? ` · ${bookNotes.join(' · ')}` : '');

    const spendPct = ap.budget_usd ? (ap.spend_estimate / ap.budget_usd) * 100 : 0;
    const budgetBar = $('ap-budget-bar');
    budgetBar.style.width = `${Math.min(100, spendPct).toFixed(1)}%`;
    budgetBar.dataset.tone = spendPct >= 100 ? 'critical'
      : spendPct >= 80 ? 'warning' : 'spend';
    $('ap-budget-value').textContent =
      `$${ap.spend_estimate.toFixed(2)} / $${ap.budget_usd.toFixed(2)}`;

    $('ap-next').textContent = nextActionText(ap);
    $('ap-today').textContent = `${ap.today_missions}/${ap.daily_cap} missions · ${ap.mode}`;
    $('ap-learning').textContent =
      `optimizer every ${ap.optimize_every} · ` +
      `${ap.optimize_applies ? 'applies rewrites' : 'proposes only'} · ` +
      `QA floor ${ap.qa_floor}`;

    const toggle = $('ap-toggle');
    const stopped = AP_STOPPED.includes(ap.status);
    toggle.textContent = stopped ? 'Start' : 'Hold';
    toggle.dataset.primary = String(stopped);
    toggle.disabled = ap.status === 'budget_reached';
    $('ap-skip').disabled = !ap.objective;

    $('ap-error').textContent = ap.status === 'budget_reached'
      ? 'Raise the ceiling in the fleet profile to continue.' : '';
  }

  function nextActionText(ap) {
    if (ap.active_run) {
      return ap.active_kind === 'optimize' ? 'optimizing prompts' : 'mission in flight';
    }
    if (AP_STOPPED.includes(ap.status)) return '—';
    const seconds = (ap.next_action_at || 0) - Date.now() / 1000;
    if (seconds <= 0) return 'imminent';
    if (seconds < 90) return `in ${Math.round(seconds)}s`;
    return `in ${Math.round(seconds / 60)}m`;
  }

  async function autopilotCommand(command, body) {
    $('ap-error').textContent = '';
    try {
      state.autopilot = await api(`/api/autopilot/${command}`, {
        method: 'POST',
        body: JSON.stringify(body || {}),
      });
      renderAutopilot();
    } catch (error) {
      $('ap-error').textContent = error.message;
    }
  }

  /* ── KPI strip ─────────────────────────────────────────────────────── */

  function renderKpis() {
    const metrics = state.metrics;
    if (!metrics) return;
    const container = $('kpis');
    container.replaceChildren();

    const ready = [...state.agents.values()]
      .filter((a) => a.dispatchable && a.readiness === 'operational').length;
    const dispatchable = [...state.agents.values()].filter((a) => a.dispatchable).length;

    const tiles = [
      ['active runs', String(metrics.runs_active), null],
      ['qa average', metrics.qa_average === null ? '—' : metrics.qa_average.toFixed(1),
        '/50', metrics.qa_timeline],
      ['topics', String(metrics.topics), null],
      ['artifacts', String(metrics.artifacts_logged), null],
      // Lifetime estimate from the QA log — distinct from the autopilot's own
      // budget meter, which tracks only what this fleet has spent.
      ['logged spend', `$${metrics.estimated_spend_usd.toFixed(2)}`, null],
      ['agents ready', `${ready}`, `/${dispatchable}`],
    ];

    for (const [label, value, unit, series] of tiles) {
      const tile = node('div', 'kpi');
      tile.appendChild(node('span', 'kpi-label', label));
      const figure = node('span', 'kpi-value', value);
      if (unit) {
        const suffix = node('span', 'unit', unit);
        figure.appendChild(suffix);
      }
      tile.appendChild(figure);
      if (series && series.length > 1) tile.appendChild(sparkline(series));
      container.appendChild(tile);
    }
  }

  /* Single-series sparkline: QA score over the last runs. No legend needed —
     the tile label names the series. */
  function sparkline(series) {
    const width = 84;
    const height = 18;
    const scores = series.map((point) => point.score);
    const min = Math.min(...scores, 30);
    const max = Math.max(...scores, 50);
    const span = Math.max(1, max - min);

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'kpi-spark');
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('aria-hidden', 'true');

    const points = scores.map((score, index) => {
      const x = scores.length === 1 ? width : (index / (scores.length - 1)) * width;
      const y = height - 2 - ((score - min) / span) * (height - 4);
      return [x, y];
    });

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', points.map((p, i) => `${i ? 'L' : 'M'} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' '));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'var(--accent)');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('stroke-linecap', 'round');
    svg.appendChild(path);

    const last = points[points.length - 1];
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', last[0].toFixed(1));
    dot.setAttribute('cy', last[1].toFixed(1));
    dot.setAttribute('r', '2.4');
    dot.setAttribute('fill', 'var(--accent)');
    svg.appendChild(dot);
    return svg;
  }

  /* ── roster ────────────────────────────────────────────────────────── */

  function renderRoster() {
    if (!state.fleet) return;
    const container = $('roster');
    const onlyLive = $('only-live').checked;
    container.replaceChildren();

    for (const squad of state.fleet.squads) {
      const members = [...state.agents.values()].filter((a) => a.squad === squad.id);
      const visible = onlyLive
        ? members.filter((a) => ['running', 'queued'].includes(a.state?.status))
        : members;
      if (!visible.length) continue;

      const block = node('div', 'squad-block');
      const heading = node('div', 'squad-label');
      const swatch = node('span', 'squad-swatch');
      swatch.style.background = squad.accent;
      heading.append(swatch, node('span', null, squad.name));
      block.appendChild(heading);

      for (const agent of visible) {
        const row = node('button', 'agent-row');
        row.type = 'button';
        row.setAttribute('aria-current', String(state.selectedAgent === agent.id));
        row.appendChild(node('span', 'agent-glyph', agent.glyph));

        const middle = node('span');
        middle.appendChild(node('span', 'agent-name', agent.name));
        const status = agent.state?.status || 'idle';
        const sub = status === 'idle' && agent.readiness === 'unconfigured'
          ? 'needs credentials'
          : agent.summary;
        middle.appendChild(node('span', 'agent-sub', truncate(sub, 34)));
        middle.style.display = 'grid';
        row.appendChild(middle);

        const badge = node('span', 'status',
          agent.readiness === 'unconfigured' && status === 'idle' ? 'dark' : status);
        badge.dataset.status = agent.readiness === 'unconfigured' && status === 'idle'
          ? 'unconfigured' : status;
        row.appendChild(badge);

        row.addEventListener('click', () => {
          state.selectedAgent = state.selectedAgent === agent.id ? null : agent.id;
          map.setSelected(state.selectedAgent);
          renderRoster();
          if (state.selectedAgent) openDrawer(agent.id); else closeDrawer();
        });
        block.appendChild(row);
      }
      container.appendChild(block);
    }

    if (!container.children.length) {
      container.appendChild(node('p', 'empty', 'No agents match this filter.'));
    }
  }

  const truncate = (text, max) => (text.length > max ? `${text.slice(0, max - 1)}…` : text);

  /* ── legend ────────────────────────────────────────────────────────── */

  function renderLegend(validation) {
    const legend = $('map-legend');
    legend.replaceChildren();
    const entries = [
      ['', 'work'],
      ['review', 'QA review'],
      ['dependency', 'external call'],
    ];
    for (const [cls, label] of entries) {
      const item = node('span', 'legend-item');
      const swatch = node('span', `legend-swatch ${cls}`.trim());
      item.append(swatch, node('span', null, label));
      legend.appendChild(item);
    }
    const verdict = node('span', 'legend-item',
      validation.ok
        ? `map validated · ${validation.warnings.length} warning(s)`
        : `map invalid · ${validation.errors.length} error(s)`);
    legend.appendChild(verdict);
  }

  /* ── launch console ────────────────────────────────────────────────── */

  function renderLaunchAgents() {
    const select = $('launch-agent');
    const previous = select.value;
    select.replaceChildren();

    for (const squad of state.fleet.squads) {
      const members = [...state.agents.values()]
        .filter((a) => a.squad === squad.id && a.dispatchable);
      if (!members.length) continue;
      const group = document.createElement('optgroup');
      group.label = squad.name;
      for (const agent of members) {
        const option = document.createElement('option');
        option.value = agent.id;
        option.textContent = agent.name;
        group.appendChild(option);
      }
      select.appendChild(group);
    }

    select.value = previous || 'mission';
    if (!select.value) select.selectedIndex = 0;
    renderLaunchParams();
  }

  function renderLaunchParams() {
    const agent = state.agents.get($('launch-agent').value);
    const container = $('launch-params');
    container.replaceChildren();
    $('launch-error').textContent = '';
    if (!agent) return;

    $('launch-blurb').textContent = agent.summary;

    if (agent.readiness === 'unconfigured') {
      const note = node('p', 'blocked-note',
        `Needs ${agent.missing_env.join(', ')} — simulate to rehearse it.`);
      container.appendChild(note);
      $('launch-simulate').checked = true;
    } else {
      $('launch-simulate').checked = state.simulateMode;
    }

    for (const param of agent.params) {
      if (param.kind === 'flag') {
        const label = node('label', 'field flag-field');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.dataset.param = param.name;
        input.checked = Boolean(param.default);
        label.append(input, node('span', null, param.label));
        container.appendChild(label);
        continue;
      }

      const label = node('label', 'field');
      label.appendChild(node('span', null,
        param.label + (param.required ? ' *' : '')));

      let input;
      if (param.kind === 'choice') {
        input = document.createElement('select');
        if (!param.required) {
          const blank = document.createElement('option');
          blank.value = '';
          blank.textContent = '—';
          input.appendChild(blank);
        }
        for (const choice of param.choices) {
          const option = document.createElement('option');
          option.value = choice;
          option.textContent = choice;
          input.appendChild(option);
        }
      } else {
        input = document.createElement('input');
        input.type = param.kind === 'int' ? 'number' : 'text';
      }
      input.dataset.param = param.name;
      if (param.default !== null && param.default !== undefined) {
        input.value = param.default;
      }
      if (param.required) input.required = true;
      label.appendChild(input);
      if (param.help) label.appendChild(node('p', 'field-help', param.help));
      container.appendChild(label);
    }
  }

  async function launch(event) {
    event.preventDefault();
    const button = $('launch-button');
    const error = $('launch-error');
    error.textContent = '';

    const agentId = $('launch-agent').value;
    const params = {};
    for (const input of $('launch-params').querySelectorAll('[data-param]')) {
      const name = input.dataset.param;
      if (input.type === 'checkbox') {
        if (input.checked) params[name] = true;
      } else if (input.value !== '') {
        params[name] = input.value;
      }
    }

    button.disabled = true;
    button.textContent = 'Deploying…';
    try {
      const payload = await api('/api/runs', {
        method: 'POST',
        body: JSON.stringify({
          agent: agentId,
          params,
          simulate: $('launch-simulate').checked,
        }),
      });
      selectRun(payload.run.id, false);
      await refreshRuns();
    } catch (failure) {
      error.textContent = failure.message;
    } finally {
      button.disabled = false;
      button.textContent = 'Deploy agent';
    }
  }

  function updateModePill() {
    const pill = $('mode-pill');
    pill.dataset.mode = state.simulateMode ? 'simulation' : 'live';
    pill.textContent = state.simulateMode ? 'simulation' : 'live';
    $('brand-sub').textContent = state.simulateMode
      ? 'simulation mode — no API calls, no writes'
      : `${state.agents.size} agents under command`;
  }

  /* ── runs ──────────────────────────────────────────────────────────── */

  function renderRuns() {
    const container = $('runs');
    container.replaceChildren();

    if (!state.runs.length) {
      container.appendChild(node('p', 'empty', 'Nothing has run yet.'));
      $('runs-note').textContent = '';
      return;
    }

    const active = state.runs.filter((r) => ['queued', 'running'].includes(r.status));
    $('runs-note').textContent = active.length ? `${active.length} active` : '';

    for (const run of state.runs.slice(0, 25)) {
      const row = node('button', 'run-row');
      row.type = 'button';
      row.setAttribute('aria-current', String(state.selectedRun === run.id));

      const title = node('span', 'run-title', run.agent_name);
      row.appendChild(title);

      if (['queued', 'running'].includes(run.status)) {
        const cancel = node('button', 'run-cancel', 'stop');
        cancel.type = 'button';
        cancel.addEventListener('click', async (event) => {
          event.stopPropagation();
          try { await api(`/api/runs/${run.id}/cancel`, { method: 'POST' }); }
          catch { /* the run finished on its own */ }
        });
        row.appendChild(cancel);
      } else {
        const badge = node('span', 'status', run.status);
        badge.dataset.status = run.status;
        row.appendChild(badge);
      }

      const topic = run.params?.topic ? `${run.params.topic} · ` : '';
      const when = run.started_at ? ago(run.started_at) : 'queued';
      const sim = run.simulated ? ' · sim' : '';
      row.appendChild(node('span', 'run-meta', `${topic}${when}${sim}`));

      row.addEventListener('click', () => selectRun(run.id, true));
      container.appendChild(row);
    }
  }

  async function selectRun(runId, scrollFeed) {
    state.selectedRun = runId;
    renderRuns();
    renderTimeline();
    if (!state.stagesByRun.has(runId)) {
      try {
        const detail = await api(`/api/runs/${runId}`);
        // Live events may have filled the stage list while this was in flight.
        if (!state.stagesByRun.has(runId)) {
          state.stagesByRun.set(runId, detail.stages || []);
        }
        if (scrollFeed && detail.log?.length) {
          state.feed = detail.log.map((entry) => ({
            ts: entry.ts, agent: detail.agent_name, text: entry.line, level: entry.level,
          }));
          renderFeed();
        }
        renderTimeline();
      } catch { /* run may have aged out of history */ }
    }
  }

  /* ── timeline ──────────────────────────────────────────────────────── */

  function renderTimeline() {
    const container = $('timeline');
    const runId = state.selectedRun;
    const stages = runId ? state.stagesByRun.get(runId) || [] : [];
    const run = state.runsById.get(runId);

    container.replaceChildren();
    $('timeline-note').textContent = run
      ? `${run.agent_name}${run.params?.topic ? ` · ${run.params.topic}` : ''}`
      : 'no run selected';

    if (!stages.length) {
      container.appendChild(node('p', 'empty',
        run ? 'Waiting for the first stage…' : 'Select a run to see its stages.'));
      return;
    }

    const now = Date.now() / 1000;
    const start = Math.min(...stages.map((s) => s.started_at || now));
    const end = Math.max(...stages.map((s) => s.finished_at || now));
    const span = Math.max(1, end - start);

    for (const stage of stages) {
      const row = node('div', 'timeline-row');
      row.appendChild(node('span', 'timeline-name', stage.name));

      const track = node('div', 'timeline-track');
      const bar = node('div', 'timeline-bar');
      const from = ((stage.started_at || start) - start) / span;
      const to = ((stage.finished_at || now) - start) / span;
      bar.style.left = `${(from * 100).toFixed(2)}%`;
      bar.style.width = `${Math.max(1.5, (to - from) * 100).toFixed(2)}%`;
      bar.dataset.status = stage.status || 'running';
      track.appendChild(bar);
      row.appendChild(track);

      const elapsed = (stage.finished_at || now) - (stage.started_at || now);
      row.appendChild(node('span', 'timeline-meta',
        stage.score ? `${stage.score}/50` : duration(elapsed)));
      container.appendChild(row);
    }
  }

  /* ── feed ──────────────────────────────────────────────────────────── */

  function pushFeed(event, text, level) {
    const agent = state.agents.get(event.agent);
    state.feed.push({
      ts: event.ts,
      agent: agent ? agent.name : event.agent || 'commander',
      text,
      level,
    });
    if (state.feed.length > MAX_FEED) state.feed.splice(0, state.feed.length - MAX_FEED);
    appendFeedLine(state.feed[state.feed.length - 1]);
  }

  function feedVisible(entry) {
    if (state.feedFilter === 'all') return true;
    if (state.feedFilter === 'event') return entry.level === 'event';
    return entry.level === 'warn' || entry.level === 'error';
  }

  function appendFeedLine(entry) {
    const container = $('feed');
    const placeholder = container.querySelector('.feed-empty');
    if (placeholder) placeholder.remove();
    if (!feedVisible(entry)) return;

    const line = node('div', 'feed-line');
    line.dataset.level = entry.level;
    line.append(
      node('span', 'feed-time', clock(entry.ts)),
      node('span', 'feed-agent', entry.agent),
      node('span', 'feed-text', entry.text),
    );
    container.appendChild(line);
    while (container.children.length > MAX_FEED) container.firstChild.remove();
    if (state.follow) container.scrollTop = container.scrollHeight;
  }

  function renderFeed() {
    const container = $('feed');
    container.replaceChildren();
    const visible = state.feed.filter(feedVisible);
    if (!visible.length) {
      container.appendChild(node('p', 'feed-empty', 'Nothing on the wire yet.'));
      return;
    }
    for (const entry of visible) appendFeedLine(entry);
  }

  /* ── QA by agent ───────────────────────────────────────────────────── */

  function renderScores() {
    const container = $('scores');
    container.replaceChildren();
    const byAgent = state.metrics?.qa_by_agent || {};
    const rows = Object.entries(byAgent).filter(([, value]) => value !== null);

    if (!rows.length) {
      container.appendChild(node('p', 'empty', 'No QA scores logged yet.'));
      return;
    }

    rows.sort((a, b) => b[1] - a[1]);
    for (const [name, average] of rows) {
      const row = node('div', 'score-row');
      row.appendChild(node('span', 'score-name', name.replace(/ Agent.*$/, '')));
      const track = node('div', 'score-track');
      const bar = node('div', 'score-bar');
      bar.style.width = `${Math.min(100, (average / 50) * 100).toFixed(1)}%`;
      track.appendChild(bar);
      row.appendChild(track);
      row.appendChild(node('span', 'score-value', average.toFixed(1)));
      container.appendChild(row);
    }
  }

  /* ── drawer ────────────────────────────────────────────────────────── */

  function openDrawer(agentId) {
    const agent = state.agents.get(agentId);
    if (!agent) return;

    $('drawer-title').textContent = agent.name;
    const body = $('drawer-body');
    body.replaceChildren();
    body.appendChild(node('p', null, agent.summary));
    if (agent.doc) body.appendChild(node('p', null, agent.doc));

    const list = document.createElement('dl');
    const facts = [
      ['squad', state.fleet.squads.find((s) => s.id === agent.squad)?.name || agent.squad],
      ['kind', agent.kind],
      ['status', agent.state?.status || 'idle'],
      ['readiness', agent.readiness],
    ];
    if (agent.state?.detail) facts.push(['last', agent.state.detail]);
    if (agent.state?.last_score) facts.push(['last QA', `${agent.state.last_score}/50`]);
    for (const [term, value] of facts) {
      list.appendChild(node('dt', null, term));
      list.appendChild(node('dd', null, String(value)));
    }
    body.appendChild(list);

    if (agent.missing_env.length) {
      const chips = node('div', 'chip-row');
      for (const key of agent.missing_env) {
        const chip = node('span', 'chip', key);
        chip.dataset.tone = 'warn';
        chips.appendChild(chip);
      }
      body.appendChild(node('p', null, 'Missing credentials:'));
      body.appendChild(chips);
    }

    if (agent.dispatchable) {
      const button = node('button', 'launch-button', `Load ${agent.name} into launcher`);
      button.type = 'button';
      button.addEventListener('click', () => {
        $('launch-agent').value = agent.id;
        renderLaunchParams();
        closeDrawer();
        $('launch-agent').focus();
      });
      body.appendChild(button);
    }

    $('drawer').hidden = false;
  }

  function closeDrawer() {
    $('drawer').hidden = true;
    if (state.selectedAgent) {
      state.selectedAgent = null;
      map.setSelected(null);
      renderRoster();
    }
  }

  /* ── controls ──────────────────────────────────────────────────────── */

  function bindControls() {
    $('launch-form').addEventListener('submit', launch);
    $('launch-agent').addEventListener('change', renderLaunchParams);
    $('only-live').addEventListener('change', renderRoster);

    $('show-review').addEventListener('change', (event) => {
      map.applyFilters({ review: event.target.checked });
    });
    $('show-dependency').addEventListener('change', (event) => {
      map.applyFilters({ dependency: event.target.checked });
    });

    $('zoom-in').addEventListener('click', () => map.zoom(0.82));
    $('zoom-out').addEventListener('click', () => map.zoom(1.22));
    $('zoom-fit').addEventListener('click', () => map.fit());

    $('follow').addEventListener('change', (event) => {
      state.follow = event.target.checked;
    });
    $('feed-filter').addEventListener('change', (event) => {
      state.feedFilter = event.target.value;
      renderFeed();
    });

    $('ap-toggle').addEventListener('click', () => {
      const stopped = AP_STOPPED.includes(state.autopilot?.status);
      autopilotCommand(stopped ? 'start' : 'pause');
    });
    $('ap-skip').addEventListener('click', () => autopilotCommand('skip'));

    $('drawer-close').addEventListener('click', closeDrawer);
    $('drawer-scrim').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !$('drawer').hidden) closeDrawer();
    });

    window.addEventListener('resize', () => {
      if (map?.ir) map.fit();
    });
  }

  boot().catch((error) => {
    setLink('lost', error.message);
    $('feed').appendChild(node('p', 'feed-empty', `Failed to start: ${error.message}`));
  });
})();

</script>
</body>
</html>
