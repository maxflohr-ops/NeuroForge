<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horde Hunt Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
/* The case board. Original art only: paper, pins and red string, no game art. */
:root{
  --board:#151110; --board2:#1d1715; --paper:#efe7d6; --paper2:#e2d6bd; --ink:#2a2220;
  --red:#d43a3a; --red2:#8f1f1f; --dim:#8a7d72; --gold:#e0b352;
  --type:"Special Elite","Courier New",monospace; --head:"Oswald","Arial Narrow",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;overflow:hidden}
body{font-family:var(--type);color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.board{position:absolute;inset:0;border-radius:18px;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.035),transparent 60%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 5px),
    linear-gradient(160deg,var(--board2),var(--board));
  box-shadow:inset 0 0 0 10px #0d0a09,inset 0 0 120px rgba(0,0,0,.7)}
header{position:absolute;left:64px;top:44px;right:64px;display:flex;align-items:flex-end;justify-content:space-between;color:var(--paper)}
header h1{font-family:var(--head);font-weight:700;font-size:58px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
header h1 small{display:block;font-size:20px;letter-spacing:.32em;color:var(--red);margin-bottom:8px}
.heat{display:flex;align-items:center;gap:18px;font-family:var(--head)}
.heat .deg{font-size:64px;font-weight:700;line-height:1;color:var(--paper);min-width:150px;text-align:right}
.heat .lbl{font-size:16px;letter-spacing:.3em;color:var(--dim)}
.meter{width:26px;height:120px;border:2px solid #3a302c;border-radius:14px;position:relative;overflow:hidden;background:#0d0a09}
.meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--red2),var(--red),var(--gold));transition:height 1.2s ease}
svg#strings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg#strings path{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;filter:drop-shadow(0 3px 2px rgba(0,0,0,.55))}
svg#strings path.new{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s ease forwards}
svg#strings text{fill:var(--paper);font-family:var(--type);font-size:17px;opacity:.82}
@keyframes draw{to{stroke-dashoffset:0}}
.card{position:absolute;width:300px;min-height:190px;padding:30px 24px 22px;
  background:linear-gradient(175deg,var(--paper),var(--paper2));
  box-shadow:0 14px 26px rgba(0,0,0,.55),0 2px 0 rgba(0,0,0,.2);transition:transform .6s ease,box-shadow .6s}
.card::before{content:"";position:absolute;left:50%;top:-9px;width:22px;height:22px;margin-left:-11px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff8a7a,var(--red) 45%,var(--red2));box-shadow:0 4px 4px rgba(0,0,0,.5)}
.card .no{font-family:var(--head);font-size:15px;letter-spacing:.28em;color:var(--red2)}
.card h2{font-family:var(--head);font-weight:500;font-size:28px;line-height:1.08;margin:6px 0 10px;text-transform:uppercase}
.card p{font-size:18px;line-height:1.35}
.card.sealed{background:linear-gradient(175deg,#3a302c,#2b2421);color:#6f625a;box-shadow:0 10px 18px rgba(0,0,0,.5)}
.card.sealed h2{color:#7d7066}
.card.sealed::before{filter:grayscale(1) brightness(.6)}
.card.active{width:440px;min-height:250px;z-index:5;box-shadow:0 0 0 3px var(--red),0 0 60px rgba(212,58,58,.38),0 18px 34px rgba(0,0,0,.6)}
.card.active h2{font-size:34px}
.card.active p{font-size:23px}
.card.found,.card.active{padding-bottom:64px}
.stamp{position:absolute;right:14px;top:12px;font-family:var(--head);font-weight:700;font-size:22px;letter-spacing:.1em;
  color:var(--red);border:3px solid var(--red);padding:3px 10px;transform:rotate(-8deg);opacity:.88;text-transform:uppercase;
  mix-blend-mode:multiply;background:transparent}
.stamp.solved{color:var(--red2);border-color:var(--red2);font-size:17px;top:auto;right:auto;bottom:16px;left:18px;transform:rotate(-3deg)}
.stamp.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(2.2) rotate(-8deg);opacity:0}}
footer{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;align-items:center;color:var(--paper);font-size:24px}
footer b{color:var(--gold);font-weight:400}
footer .door{font-family:var(--head);letter-spacing:.2em;text-transform:uppercase;font-size:20px;color:var(--dim)}
footer .door.open{color:var(--gold)}
.toast{position:absolute;left:50%;top:150px;transform:translateX(-50%);background:var(--red);color:#fff;font-family:var(--head);
  font-size:30px;letter-spacing:.08em;padding:12px 30px;border-radius:4px;opacity:0;transition:opacity .4s;z-index:9}
.toast.on{opacity:1}
/* mini: a corner strip for the gameplay scene */
body.mini #stage{width:620px;height:210px}
body.mini .board{border-radius:12px}
body.mini header{left:22px;right:22px;top:16px}
body.mini header h1{font-size:22px}
body.mini header h1 small{font-size:11px;margin-bottom:3px}
body.mini .heat .deg{font-size:30px;min-width:70px}
body.mini .heat .lbl,body.mini .meter,body.mini svg#strings,body.mini .card:not(.active),body.mini footer .door{display:none}
body.mini .card.active{left:22px!important;top:66px!important;width:576px;min-height:0;padding:12px 16px;transform:none!important;box-shadow:0 0 0 2px var(--red)}
body.mini .card.active::before{display:none}
body.mini .card.active h2{font-size:20px;margin:2px 0 4px}
body.mini .card.active p{font-size:16px}
body.mini .card .stamp{display:none}
body.mini footer{left:22px;right:22px;bottom:8px;font-size:14px}
body.mini .toast{top:6px;font-size:16px;padding:4px 14px}
</style>
</head>
<body>
<div id="stage">
  <div class="board"></div>
  <header>
    <h1><small>the case board</small><span id="name">Horde Hunt</span></h1>
    <div class="heat"><div><div class="deg" id="deg">0°</div><div class="lbl">HEAT</div></div><div class="meter"><i id="mtr" style="height:0"></i></div></div>
  </header>
  <svg id="strings"></svg>
  <div id="cards"></div>
  <div class="toast" id="toast"></div>
  <footer><div id="how">type <b>!clue your answer</b> in chat</div><div class="door" id="door">door shut</div></footer>
</div>
<script>
const Q=new URLSearchParams(location.search);
const MINI=Q.get('mini')==='1';
if(MINI)document.body.classList.add('mini');
const SRC=Q.get('src')||'/hunt/state';
const stage=document.getElementById('stage');
function fit(){const w=MINI?620:1920,h=MINI?210:1080;const s=Math.min(innerWidth/w,innerHeight/h);stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();

// deterministic jitter so cards don't jump between polls
function rnd(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return ()=>((h=Math.imul(h^h>>>15,2246822507),h^=h>>>13,(h>>>0)/4294967296))}
function layout(n){
  const cols=Math.max(1,Math.ceil(Math.sqrt(n*1.9))),rows=Math.ceil(n/cols);
  const L=80,T=200,W=1920-160-300,H=1080-200-170-190;
  return Array.from({length:n},(_,i)=>{const r=Math.floor(i/cols),c=r%2?cols-1-(i%cols):i%cols; // snake, so strings read in order
    return {x:L+(cols>1?c*W/(cols-1):W/2),y:T+(rows>1?r*H/(rows-1):H/2)}});
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let prev={},prevLast=null,first=true;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),4200)}

function render(st){
  document.getElementById('name').textContent=st.hunt;
  document.getElementById('deg').textContent=st.heat+'°';
  document.getElementById('mtr').style.height=st.heat+'%';
  const door=document.getElementById('door');
  door.textContent=st.door_open?'the door is open':`${st.found} of ${st.total} found · door shut`;
  door.classList.toggle('open',!!st.door_open);
  document.getElementById('how').innerHTML=st.door_open?'every mark found. <b>the door is open.</b>':(st.active&&st.active.manual?'chat can watch this one: <b>no answer needed</b>':'type <b>!clue your answer</b> in chat');
  const pos=layout(st.cards.length),box=document.getElementById('cards');
  const html=st.cards.map((c,i)=>{const r=rnd(c.id),p=pos[i],rot=(r()-.5)*7,dx=(r()-.5)*40,dy=(r()-.5)*30;
    const was=prev[c.id]||{};
    const solved=c.solver?`<div class="stamp solved${!first&&!was.solver?' pop':''}">solved @${esc(c.solver)}</div>`:'';
    const found=c.status==='found'?`<div class="stamp${!first&&was.status!=='found'?' pop':''}">found</div>`:'';
    const body=c.status==='sealed'?`<h2>sealed</h2><p>opens when clue ${c.n-1} is found</p>`:`<h2>${esc(c.title)}</h2><p>${esc(c.riddle)}</p>`;
    return `<div class="card ${c.status}" data-id="${esc(c.id)}" style="left:${p.x+dx}px;top:${p.y+dy}px;transform:rotate(${rot}deg)"><div class="no">CLUE ${c.n} / ${st.total}</div>${body}${solved}${found}</div>`}).join('');
  box.innerHTML=html;
  // red string between found cards, in order, then on to the active card
  requestAnimationFrame(()=>{
    const svg=document.getElementById('strings');const els=[...box.children];let out='';
    for(let i=0;i<st.cards.length-1;i++){
      const a=st.cards[i],b=st.cards[i+1];if(a.status!=='found')break;
      const ea=els[i],eb=els[i+1];const ax=ea.offsetLeft+ea.offsetWidth/2,ay=ea.offsetTop,bx=eb.offsetLeft+eb.offsetWidth/2,by=eb.offsetTop;
      const mx=(ax+bx)/2,my=Math.max(ay,by)+60+Math.abs(bx-ax)*.08; // string sags
      const len=Math.hypot(bx-ax,by-ay)*1.25;const isNew=!first&&(prev[a.id]||{}).status!=='found';
      out+=`<path class="${isNew?'new':''}" style="--len:${len}" d="M${ax} ${ay} Q${mx} ${my} ${bx} ${by}"/>`;
      if(a.string)out+=`<text x="${mx}" y="${(ay+by)/2+46}" text-anchor="middle">${esc(a.string)}</text>`;
    }
    svg.innerHTML=out;
  });
  const last=st.last;
  if(!first&&last&&JSON.stringify(last)!==JSON.stringify(prevLast)){
    const c=st.cards.find(x=>x.id===last.id);
    if(last.what==='solve'&&c)toast(`@${last.login} cracked clue ${c.n}`);
    if(last.what==='found'&&c)toast(`clue ${c.n} found${c.solver?' · @'+c.solver+' was right':''}`);
  }
  prevLast=last;prev=Object.fromEntries(st.cards.map(c=>[c.id,{status:c.status,solver:c.solver}]));first=false;
  document.body.dataset.ready='1';
}
async function poll(){try{const r=await fetch(SRC,{cache:'no-store'});render(await r.json())}catch(e){}setTimeout(poll,1500)}
poll();
</script>
</body>
</html>
