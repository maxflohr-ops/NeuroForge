<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horde Hunt Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Hallmark · redesign · genre: atmospheric · theme: Lumen (night) · tone: after-hours dossier
 * surface: OBS overlay 1920×1080 + mini strip 620×210 · anchor hue: crimson 25°
 * structure: one focal clue + one rail (the red string) · motion: rail fill · active pulse · toast
 * Hallmark · pre-emit critique: P4 H5 E4 S5 R5 V4
 * Original art only: type, one rule, one glow. No game art.
 */
:root{
  --color-paper:   oklch(13% 0.012 30);
  --color-paper-2: oklch(17% 0.014 30);
  --color-ink:     oklch(95% 0.008 80);
  --color-ink-2:   oklch(74% 0.012 60);
  --color-ink-3:   oklch(52% 0.012 40);
  --color-rule:    oklch(30% 0.012 30);
  --color-accent:  oklch(62% 0.2 25);
  --color-accent-2:oklch(62% 0.2 25 / 0.16);
  --color-door:    oklch(82% 0.12 80);
  --color-bloom:   oklch(45% 0.16 25 / 0.32);

  --font-display: "Instrument Serif", "Times New Roman", serif;
  --font-body:    "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --font-mono:    "JetBrains Mono", "SFMono-Regular", Menlo, monospace;

  --space-2xs:4px; --space-xs:8px; --space-sm:12px; --space-md:16px; --space-lg:24px;
  --space-xl:40px; --space-2xl:64px; --space-3xl:96px;

  --text-xs:15px; --text-sm:18px; --text-md:22px; --text-lg:30px; --text-xl:38px;
  --text-2xl:64px; --text-display:132px;

  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in-out:cubic-bezier(.65,0,.35,1);
  --dur-fast:180ms; --dur-med:420ms; --dur-slow:1100ms;
  --radius-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:clip;background:transparent}
body{font-family:var(--font-body);color:var(--color-ink);-webkit-font-smoothing:antialiased}

#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:
    radial-gradient(900px 620px at 18% 42%,var(--color-bloom),transparent 70%),
    var(--color-paper)}

/* ── top: eyebrow + hunt name · heat ───────────────────────────── */
.top{position:absolute;left:var(--space-3xl);right:var(--space-3xl);top:var(--space-2xl);
  display:flex;justify-content:space-between;align-items:flex-start}
.eyebrow{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:.24em;text-transform:uppercase;color:var(--color-accent)}
.hunt{font-family:var(--font-display);font-size:var(--text-xl);color:var(--color-ink-2);margin-top:var(--space-xs);font-weight:400}
.heat{text-align:right}
.heat .num{font-family:var(--font-mono);font-size:var(--text-2xl);font-weight:500;line-height:1;color:var(--color-ink);font-variant-numeric:tabular-nums}
.heat .num sup{font-size:.5em;color:var(--color-ink-3);vertical-align:.7em;margin-left:1px}
.meter{width:240px;height:3px;background:var(--color-rule);margin:var(--space-sm) 0 0 auto;border-radius:var(--radius-pill);overflow:hidden}
.meter i{display:block;height:100%;background:var(--color-accent);transform-origin:left;transform:scaleX(0);transition:transform var(--dur-slow) var(--ease-out)}

/* ── focal: the active clue ─────────────────────────────────────── */
.focus{position:absolute;left:var(--space-3xl);top:250px;width:1240px}
.kicker{font-family:var(--font-mono);font-size:var(--text-sm);color:var(--color-ink-3);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.kicker b{color:var(--color-ink);font-weight:500}
.title{font-family:var(--font-display);font-weight:400;font-style:normal;font-size:var(--text-display);line-height:.92;letter-spacing:-.02em;margin-top:var(--space-md);overflow-wrap:anywhere}
.riddle{font-size:var(--text-lg);line-height:1.35;color:var(--color-ink-2);max-width:30ch;margin-top:var(--space-lg)}
.call{display:inline-flex;align-items:center;gap:var(--space-sm);margin-top:var(--space-xl);
  font-size:var(--text-md);color:var(--color-ink);padding:var(--space-xs) var(--space-md) var(--space-xs) var(--space-sm);
  border-radius:var(--radius-pill);background:var(--color-accent-2)}
.call::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--color-accent)}
.call[hidden]{display:none}
.focus.open .title{color:var(--color-door)}
.focus.open .call{background:transparent;padding-left:0}
.focus.open .call::before{background:var(--color-door)}

/* ── the rail: the red string, one node per clue ─────────────────── */
.rail{position:absolute;left:var(--space-3xl);right:var(--space-3xl);bottom:250px;display:flex;align-items:flex-start}
.node{position:relative;flex:0 0 auto;width:28px}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--color-rule);background:var(--color-paper);
  display:grid;place-items:center;transition:border-color var(--dur-med) var(--ease-out),background-color var(--dur-med) var(--ease-out)}
.dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--color-accent);transform:scale(0);transition:transform var(--dur-med) var(--ease-out)}
.node.found .dot{border-color:var(--color-accent);background:var(--color-accent)}
.node.found .dot::after{background:var(--color-paper);transform:scale(.6)}
.node.active .dot{border-color:var(--color-accent)}
.node.active .dot::after{transform:scale(1)}
.node.active .dot{animation:pulse 2.4s var(--ease-in-out) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px var(--color-accent-2)}}
.label{position:absolute;top:44px;left:0;width:260px}
.node:last-child .label{left:auto;right:0;text-align:right}
.label .n{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-ink-3);letter-spacing:.08em}
.label .t{font-size:var(--text-md);font-weight:500;color:var(--color-ink);margin-top:var(--space-2xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label .w{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-accent);margin-top:var(--space-2xs);min-height:1.3em}
.node.sealed .label .t{color:var(--color-ink-3)}
.seg{flex:1 1 0;height:2px;margin-top:13px;background:var(--color-rule);position:relative}
.seg i{position:absolute;inset:0;background:var(--color-accent);transform-origin:left;transform:scaleX(0);transition:transform var(--dur-slow) var(--ease-out)}
.seg.lit i{transform:scaleX(1)}
.seg .s{position:absolute;left:50%;top:-34px;transform:translateX(-50%);white-space:nowrap;font-size:var(--text-xs);color:var(--color-ink-3);opacity:0;transition:opacity var(--dur-med) var(--ease-out)}
.seg.lit .s{opacity:1}

/* ── base line ───────────────────────────────────────────────────── */
.base{position:absolute;left:var(--space-3xl);right:var(--space-3xl);bottom:var(--space-2xl);display:flex;justify-content:space-between;
  font-size:var(--text-sm);color:var(--color-ink-2)}
.base kbd{font-family:var(--font-mono);color:var(--color-ink);background:var(--color-paper-2);padding:2px var(--space-xs);border-radius:6px}
.base .door{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:.2em;text-transform:uppercase;color:var(--color-ink-3);align-self:center}
.base .door.open{color:var(--color-door)}

/* ── toast ───────────────────────────────────────────────────────── */
.toast{position:absolute;left:50%;top:var(--space-2xl);transform:translate(-50%,-12px);opacity:0;
  background:var(--color-ink);color:var(--color-paper);font-size:var(--text-md);font-weight:500;
  padding:var(--space-sm) var(--space-lg);border-radius:var(--radius-pill);
  transition:opacity var(--dur-med) var(--ease-out),transform var(--dur-med) var(--ease-out)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── mini strip (620×210) for the gameplay scene ─────────────────── */
body.mini #stage{width:620px;height:210px;border-radius:14px;
  background:radial-gradient(300px 200px at 0% 0%,var(--color-bloom),transparent 70%),var(--color-paper)}
body.mini .top{left:22px;right:22px;top:18px;align-items:center}
body.mini .hunt,body.mini .meter,body.mini .rail .label,body.mini .seg .s,body.mini .base,body.mini .riddle{display:none}
body.mini .eyebrow{font-size:11px}
body.mini .heat .num{font-size:24px}
body.mini .focus{left:22px;top:52px;width:576px}
body.mini .kicker{font-size:12px}
body.mini .title{font-size:40px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mini .call{font-size:14px;margin-top:6px;padding:2px 10px 2px 8px}
body.mini .call::before{width:7px;height:7px}
body.mini .rail{left:22px;right:22px;bottom:18px}
body.mini .node,body.mini .dot{width:14px;height:14px}
body.mini .dot{border-width:1.5px}
body.mini .dot::after{width:5px;height:5px}
body.mini .seg{margin-top:6px;height:1.5px}
body.mini .toast{top:8px;font-size:13px;padding:4px 12px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:120ms!important;animation:none!important}
}
</style>
</head>
<body>
<div id="stage">
  <div class="top">
    <div><div class="eyebrow">Horde Hunt</div><div class="hunt" id="name">—</div></div>
    <div class="heat"><div class="num" id="deg">0<sup>°</sup></div><div class="meter"><i id="mtr"></i></div></div>
  </div>
  <section class="focus" id="focus">
    <div class="kicker" id="kick"></div>
    <h1 class="title" id="title"></h1>
    <p class="riddle" id="riddle"></p>
    <div class="call" id="call" hidden></div>
  </section>
  <div class="rail" id="rail"></div>
  <div class="base"><div id="how">Type <kbd>!clue your answer</kbd> in chat</div><div class="door" id="door"></div></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>
const Q=new URLSearchParams(location.search);
const MINI=Q.get('mini')==='1';
if(MINI)document.body.classList.add('mini');
const SRC=Q.get('src')||'/hunt/state';
const $=id=>document.getElementById(id);
const stage=$('stage');
function fit(){const w=MINI?620:1920,h=MINI?210:1080;stage.style.transform=`scale(${Math.min(innerWidth/w,innerHeight/h)})`}
addEventListener('resize',fit);fit();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
let prevLast=null,first=true;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),4200)}

function render(st){
  $('name').textContent=st.hunt;
  $('deg').innerHTML=`${st.heat}<sup>°</sup>`;
  $('mtr').style.transform=`scaleX(${st.heat/100})`;
  const a=st.active,focus=$('focus'),call=$('call');
  focus.classList.toggle('open',!!st.door_open);
  if(a){
    $('kick').innerHTML=`Clue <b>${pad(a.n)}</b> / ${pad(st.total)}`;
    $('title').textContent=a.title;
    $('riddle').textContent=a.riddle;
    call.hidden=!(a.solver||a.manual);
    call.textContent=a.solver?`@${a.solver} called it. Waiting on the game.`:'No answer needed. Watch this one.';
  }else{
    $('kick').innerHTML=`All <b>${pad(st.total)}</b> found`;
    $('title').textContent='The door is open.';
    const who=st.cards.filter(c=>c.solver).map(c=>'@'+c.solver);
    $('riddle').textContent=who.length?`Solved by ${who.join(', ')}.`:'Every mark found.';
    call.hidden=false;call.textContent='Watch for the door code.';
  }
  $('how').innerHTML=st.door_open?'Thanks for hunting.':(a&&a.manual?'Chat can sit this one out.':'Type <kbd>!clue your answer</kbd> in chat');
  const door=$('door');door.textContent=st.door_open?'Door open':`${st.found} of ${st.total} found`;door.classList.toggle('open',!!st.door_open);

  // the rail: node, segment, node … — a segment lights once the clue before it is found
  let html='';
  st.cards.forEach((c,i)=>{
    const t=c.status==='sealed'?'Sealed':esc(c.title);
    html+=`<div class="node ${c.status}" data-id="${esc(c.id)}"><div class="dot"></div>
      <div class="label"><div class="n">${pad(c.n)}</div><div class="t">${t}</div><div class="w">${c.solver?'@'+esc(c.solver):''}</div></div></div>`;
    if(i<st.cards.length-1)html+=`<div class="seg ${c.status==='found'?'lit':''}"><i></i>${c.string?`<span class="s">${esc(c.string)}</span>`:''}</div>`;
  });
  const rail=$('rail');
  if(first){
    // first paint: draw lit segments unlit, then let them fill
    rail.innerHTML=html.replace(/class="seg lit"/g,'class="seg" data-lit');
    requestAnimationFrame(()=>requestAnimationFrame(()=>rail.querySelectorAll('[data-lit]').forEach(s=>s.classList.add('lit'))));
  }else{
    const lit=[...rail.querySelectorAll('.seg')].map(s=>s.classList.contains('lit'));
    rail.innerHTML=html;
    // segments that just lit start empty and fill
    rail.querySelectorAll('.seg').forEach((s,i)=>{if(s.classList.contains('lit')&&!lit[i]){s.classList.remove('lit');requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('lit')))}});
  }

  const last=st.last;
  if(!first&&last&&JSON.stringify(last)!==JSON.stringify(prevLast)){
    const c=st.cards.find(x=>x.id===last.id);
    if(last.what==='solve'&&c)toast(`@${last.login} cracked clue ${c.n}`);
    if(last.what==='found'&&c)toast(`Clue ${c.n} found${c.solver?` · @${c.solver} was right`:''}`);
  }
  prevLast=last;first=false;
  document.body.dataset.ready='1';
}
async function poll(){try{const r=await fetch(SRC,{cache:'no-store'});render(await r.json())}catch(e){}setTimeout(poll,1500)}
poll();
</script>
</body>
</html>
