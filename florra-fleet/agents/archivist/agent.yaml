# Agent 001 — the Archivist. Backend lore management for the Bandersnatch Discord.
name: archivist
description: >
  Intake, classification, canon-consistency checking, and filing to THE FILE.
  Backend-toned. No roleplay. The office keeps everything.

# One Discord application per agent — env var names, never raw secrets.
discord_token_env: DISCORD_TOKEN_ARCHIVIST
guild_id_env: DISCORD_GUILD_ID

# Task tier -> env var holding the model id. Model ids live in .env only.
models:
  classify: MODEL_CLASSIFY   # taking test, class number, dedupe
  standard: MODEL_STANDARD   # caption cards, filing summaries, lorecheck
  canon: MODEL_CANON         # anything written in the estate's voice

max_tokens_default: 1024

# Channel ids where passive intake watches for loc.gov links.
# Empty = passive intake off; slash commands + @mentions still work.
intake_channels:
  - 1524654890201382983  # #virginia-the-brand (bandersnatch / virginia)
  - 1481899024922443798  # #general

rate_limit:
  per_user_per_minute: 4
  per_channel_per_minute: 12

options:
  # auto workup: every substantive post in intake channels gets the full
  # treatment — taking test + lorecheck + the command menu. loc.gov links
  # still go through the filing pipeline instead.
  auto_workup:
    enabled: true
    min_chars: 15   # ignore drive-by reactions and one-worders
  # weekly ledger: what the office filed this week. sunday, services at 10 a.m.
  ledger:
    channel_id: 1524654890201382983   # #virginia-the-brand
    weekday: 6                        # python weekday: monday=0 ... sunday=6
    hour: 10
    timezone: America/Los_Angeles
  # tip line: fans report strange places -> untitled harbor-contract candidates.
  # per the bible, the submission-license paragraph must exist before it opens —
  # leave channel_id null until legal clears it.
  tipline:
    channel_id: null
