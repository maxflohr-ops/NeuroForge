# One service per agent. All agents share the data volume (sqlite ops state).
services:
  archivist:
    build: .
    command: ["archivist"]
    env_file: .env
    environment:
      FLEET_DATA_DIR: /app/data
      FLEET_LOG_DIR: /app/logs
    volumes:
      - fleet-data:/app/data
      - fleet-logs:/app/logs
    restart: unless-stopped

  # website chat: the same agent served as an HTTP endpoint + widget
  archivist-web:
    build: .
    entrypoint: ["python", "web_runner.py"]
    command: ["archivist"]
    env_file: .env
    environment:
      FLEET_DATA_DIR: /app/data
      FLEET_LOG_DIR: /app/logs
    ports:
      - "8080:8080"
    volumes:
      - fleet-data:/app/data
      - fleet-logs:/app/logs
    restart: unless-stopped

  # agent 002 — florra, the ops agent (CRM / outreach / ad summaries).
  # Proof that adding an agent is a folder + a token + this block — zero core changes.
  florra:
    build: .
    command: ["florra"]
    env_file: .env
    environment:
      FLEET_DATA_DIR: /app/data
      FLEET_LOG_DIR: /app/logs
    volumes:
      - fleet-data:/app/data
      - fleet-logs:/app/logs
    restart: unless-stopped

volumes:
  fleet-data:
  fleet-logs:
