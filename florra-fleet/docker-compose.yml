# One service per agent. All agents share the data volume (sqlite ops state).
services:
  archivist:
    build: .
    command: ["archivist"]
    env_file: .env
    environment:
      FLEET_DATA_DIR: /app/data
      FLEET_LOG_DIR: /app/logs
    volumes:
      - fleet-data:/app/data
      - fleet-logs:/app/logs
    restart: unless-stopped

  # agent 002 template — new Discord app + agents/<name>/ folder, nothing else:
